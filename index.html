    * {

      font-family: Consolas, Menlo, Monaco, 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace;
      margin: 0;
      padding: 0;
    }
    :root {

      --font-lyric: Consolas, Menlo, Monaco, 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace;
      --lyric-size: 0.85rem;
      --label-size: 1rem;
      --label-radius: 4px;
      --ui-scale: 1;
      --editor-scale: 1;
      --current-song-size: 0.8rem;
      --chord-line-height: 1.9;
      --empty-line-height: 24px;
      --chord-letter-spacing: 0em;
      --lyric-letter-spacing: 0em;
      --label-letter-spacing: 0em;
      --space-width: 0.6em;
      --pipe-scale: 2.25;
      --pipe-thickness: 0.03em;
      --pipe-vertical-align: 0.2em;

    }
    html { font-size: clamp(14px, 1.05vw + 8px, 18px); }
    html, body { height: 100%; overflow: hidden; }
    body { background: #d4c5a0; padding: 0; margin: 0; }

    .app {
      max-width: none;
      width: 100vw;
      height: 100vh;
      background: #f5ede0;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: none;
    }

    .toolbar {
      background: #e8dccc;
      padding: calc(6px * var(--ui-scale)) calc(12px * var(--ui-scale));
      border-bottom: 2px solid #dcc9b0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: calc(6px * var(--ui-scale)) calc(10px * var(--ui-scale));
      flex-shrink: 0;
    }
    .toolbar-left { display: flex; flex-direction: column; align-items: stretch; gap: calc(6px * var(--ui-scale)); width: 100%; }
    .toolbar-row { display: flex; flex-wrap: wrap; align-items: center; gap: calc(6px * var(--ui-scale)) calc(8px * var(--ui-scale)); }
    .toolbar h1 { font-size: calc(1.0rem * var(--ui-scale)); font-weight: 600; color: #5c4033; letter-spacing: -0.01em; display: flex; align-items: center; gap: calc(6px * var(--ui-scale)); margin-right: calc(6px * var(--ui-scale)); }

    .current-song {

      padding: calc(3px * var(--ui-scale)) calc(12px * var(--ui-scale));

      font-weight: 500;
      color: #5c4033;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: calc(280px * var(--ui-scale));
      flex-shrink: 0;
    }
    .current-song.show { display: inline-flex; }
    .current-song::before { content: '🎵 '; flex-shrink: 0; }

    .btn {
      background: #dcc9b0;
      border: 1px solid #c4ad92;
      padding: calc(5px * var(--ui-scale)) calc(14px * var(--ui-scale));
      border-radius: 40px;
      font-size: calc(0.85rem * var(--ui-scale));
      font-weight: 500;
      color: #3d2b1f;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: calc(4px * var(--ui-scale));
      white-space: nowrap;
    }
    .btn:hover { background: #c4ad92; border-color: #b0987a; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-success { background: #8b6b4a; border-color: #7a5d3f; color: white; }
    .btn-success:hover { background: #7a5d3f; border-color: #6b4f35; }
    .btn-success:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-outline { background: transparent; border: 1px solid #c4ad92; color: #5c4033; }
    .btn-outline:hover { background: #dcc9b0; border-color: #b0987a; }
    .btn.active { background: #5c4033; border-color: #4a3328; color: white; }

    .btn-toggle {
      background: #dcc9b0;
      border: 1px solid #c4ad92;
      padding: calc(5px * var(--ui-scale)) calc(14px * var(--ui-scale));
      border-radius: 40px;
      font-size: calc(0.85rem * var(--ui-scale));
      font-weight: 500;
      color: #3d2b1f;
      cursor: pointer;

    .btn-toggle:hover { background: #c4ad92; border-color: #b0987a; }
    .btn-toggle.active { background: #5c4033; border-color: #4a3328; color: white; }

    .btn-transpose {

    .transpose-info {

    .dropdown { position: relative; display: inline-block; }
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #f5ede0;
      min-width: calc(260px * var(--ui-scale));

      overflow-y: auto;
      overflow-x: hidden;

      margin-top: 4px;
    }
    .dropdown-content.show { display: block; }
    .dropdown-content .dropdown-item {
      padding: calc(8px * var(--ui-scale)) calc(16px * var(--ui-scale));
      font-size: calc(0.85rem * var(--ui-scale));
      font-weight: 500;
      color: #5c4033;
      cursor: pointer;
      transition: background 0.1s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    }
    .dropdown-content .dropdown-item:hover { background: #ece0cf; }
    .dropdown-content .dropdown-item.active { background: #5c4033; color: white; }
    .dropdown-content .dropdown-item.song-item {
      padding-left: calc(6px * var(--ui-scale));
      padding-right: calc(12px * var(--ui-scale));
      font-size: calc(0.8rem * var(--ui-scale));
      display: flex;
      align-items: center;
      gap: calc(6px * var(--ui-scale));
    }
    .dropdown-content .dropdown-item.song-item .song-name {
      flex: 1 1 auto;
      min-width: 0;
      padding-left: calc(2px * var(--ui-scale));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dropdown-content .dropdown-item.song-item .song-name::before { content: '🎵 '; }
    .dropdown-content .dropdown-item.song-item.has-settings .song-name::after { content: ' 🎚️'; opacity: 0.7; }
    .dropdown-content .dropdown-item.song-item .remove-btn {
      background: none;
      border: none;
      color: #c45a4a;
      font-size: calc(0.9rem * var(--ui-scale));
      cursor: pointer;
      padding: 0 calc(4px * var(--ui-scale));
      font-weight: 600;
      opacity: 0.6;
      flex: 0 0 auto;
    }
    .dropdown-content .dropdown-item.song-item .remove-btn:hover { opacity: 1; }
    .dropdown-content .dropdown-item.folder-item {
      padding-left: calc(10px * var(--ui-scale));
      font-weight: 600;
      font-size: calc(0.85rem * var(--ui-scale));
      color: #8b6b4a;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-content .dropdown-item.folder-item::before { content: '📁 '; }
    .dropdown-content .dropdown-item.folder-item .folder-arrow { font-size: calc(0.7rem * var(--ui-scale)); color: #b0987a; margin-left: calc(8px * var(--ui-scale)); }
    .dropdown-divider { border-top: 1px solid #dcc9b0; margin: 6px 8px; }
    .dropdown-label {
      padding: calc(6px * var(--ui-scale)) calc(16px * var(--ui-scale)) calc(3px * var(--ui-scale)) calc(16px * var(--ui-scale));
      font-size: calc(0.7rem * var(--ui-scale));
      font-weight: 600;
      color: #b0987a;
      text-transform: uppercase;

    }
    .subfolder-popup {
      display: none;
      position: absolute;
      left: 100%;
      top: -4px;
      background-color: #f5ede0;
      min-width: calc(200px * var(--ui-scale));
      max-width: min(calc(520px * var(--ui-scale)), 80vw);
      width: max-content;
      max-height: 350px;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      border-radius: 8px;
      border: 1px solid #dcc9b0;
      z-index: 200;
      padding: 6px 0;
      margin-left: 2px;
    }
    .subfolder-popup.show { display: block; }
    .subfolder-popup .dropdown-item {
      padding: calc(8px * var(--ui-scale)) calc(16px * var(--ui-scale));
      font-size: calc(0.8rem * var(--ui-scale));
      font-weight: 500;
      color: #5c4033;
      cursor: pointer;
      position: relative;
    }
    .subfolder-popup .dropdown-item:hover { background: #ece0cf; }
    .subfolder-popup .dropdown-item.song-item {
      padding-left: calc(6px * var(--ui-scale));
      padding-right: calc(12px * var(--ui-scale));
      display: flex;
      align-items: center;
      gap: calc(6px * var(--ui-scale));
    }
    .subfolder-popup .dropdown-item.song-item .song-name {
      flex: 1 1 auto;
      min-width: 0;
      padding-left: calc(2px * var(--ui-scale));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subfolder-popup .dropdown-item.song-item .song-name::before { content: '🎵 '; }
    .subfolder-popup .dropdown-item.song-item.has-settings .song-name::after { content: ' 🎚️'; opacity: 0.7; }
    .subfolder-popup .dropdown-item.song-item .remove-btn {
      background: none;
      border: none;
      color: #c45a4a;
      font-size: calc(0.9rem * var(--ui-scale));
      cursor: pointer;
      padding: 0 calc(4px * var(--ui-scale));
      font-weight: 600;
      opacity: 0.6;
      flex: 0 0 auto;
    }
    .subfolder-popup .dropdown-item.song-item .remove-btn:hover { opacity: 1; }
    .subfolder-popup .dropdown-item.folder-item {
      padding-left: calc(10px * var(--ui-scale));
      font-weight: 600;
      color: #8b6b4a;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .subfolder-popup .dropdown-item.folder-item::before { content: '📂 '; }

    .sizes-panel {
      min-width: calc(340px * var(--ui-scale));
      max-width: min(calc(420px * var(--ui-scale)), 95vw);
      width: max-content;
      padding: 8px 0;
    }
    .sizes-lock-row {
      display: flex;
      align-items: center;
      gap: calc(8px * var(--ui-scale));
      padding: calc(4px * var(--ui-scale)) calc(12px * var(--ui-scale)) calc(8px * var(--ui-scale)) calc(12px * var(--ui-scale));
      border-bottom: 1px solid #ece0cf;
      cursor: pointer;
      user-select: none;
    }
    .sizes-lock-row input[type="checkbox"] { accent-color: #8b6b4a; cursor: pointer; margin: 0; flex: 0 0 auto; width: calc(14px * var(--ui-scale)); height: calc(14px * var(--ui-scale)); }
    .sizes-lock-row label { font-size: calc(0.8rem * var(--ui-scale)); font-weight: 600; color: #5c4033; cursor: pointer; flex: 1 1 auto; }
    .sizes-row {
      display: flex;
      align-items: center;
      gap: calc(8px * var(--ui-scale));
      padding: calc(6px * var(--ui-scale)) calc(12px * var(--ui-scale));
      white-space: nowrap;
    }
    .sizes-row + .sizes-row { border-top: 1px solid #ece0cf; }
    .sizes-row-label { font-size: calc(0.8rem * var(--ui-scale)); font-weight: 600; color: #5c4033; flex: 0 0 calc(85px * var(--ui-scale)); white-space: nowrap; }
    .sizes-row input[type="range"] { flex: 1 1 auto; min-width: calc(80px * var(--ui-scale)); accent-color: #8b6b4a; cursor: pointer; margin: 0; vertical-align: middle; }
    .sizes-row input[type="number"] {
      width: calc(56px * var(--ui-scale));
      border: 1px solid #c4ad92;
      border-radius: 6px;
      padding: calc(3px * var(--ui-scale)) calc(5px * var(--ui-scale));
      font-size: calc(0.75rem * var(--ui-scale));
      font-family: inherit;
      color: #3d2b1f;
      background: #ffffff;
      outline: none;
      text-align: right;
      -moz-appearance: textfield;
      flex: 0 0 auto;
    }
    .sizes-row input[type="number"]::-webkit-outer-spin-button,
    .sizes-row input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    .sizes-row input[type="number"]:focus { border-color: #8b6b4a; box-shadow: 0 0 0 2px rgba(139, 107, 74, 0.2); }
    .sizes-row-step {
      background: #f5ede0;
      border: 1px solid #c4ad92;
      color: #5c4033;
      font-size: calc(0.85rem * var(--ui-scale));
      font-weight: 700;
      line-height: 1;
      padding: 0;
      margin: 0;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      width: calc(18px * var(--ui-scale));
      height: calc(18px * var(--ui-scale));
      flex: 0 0 auto;
    }
    .sizes-row-step:hover { background: #dcc9b0; }
    .sizes-row-step:active { background: #c4ad92; }
    .sizes-row-reset {
      background: transparent;
      border: none;
      color: #8b6b4a;
      font-size: calc(0.95rem * var(--ui-scale));
      line-height: 1;
      padding: calc(2px * var(--ui-scale)) calc(6px * var(--ui-scale)) calc(2px * var(--ui-scale)) calc(4px * var(--ui-scale));
      margin-left: 0;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      flex: 0 0 auto;
    }
    .sizes-row-reset:hover { background: #c4ad92; color: #3d2b1f; }
    .sizes-row-reset:active { background: #b0987a; }

    .sizes-panel.locked .sizes-row input,
    .sizes-panel.locked .sizes-row button { opacity: 0.45; pointer-events: none; }
    .settings-panel.locked .settings-row input,
    .settings-panel.locked .settings-row select,
    .settings-panel.locked .settings-row button { opacity: 0.45; pointer-events: none; }

    .editor-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .editor-wrapper.layout-phone {
      flex-direction: row;
    }
    /* Phone View: editor is placed BEFORE preview in the DOM (see applyLayout),
       so with flex-direction: row the editor renders on the LEFT and preview on
       the RIGHT. The input-area's right border now sits between them. */
    .editor-wrapper.layout-desktop {
      flex-direction: column;
    }

    .preview-area {
      width: 100%;
      background: #f5ede0;
      padding: 12px 20px 16px 20px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .editor-wrapper.layout-phone .preview-area {
      width: auto;
      flex: 1 1 auto;
      min-width: 0;
    }

    .input-area {
      width: 100%;
      padding: 8px 14px 10px 14px;
      background: #f5ede0;
      border-top: 2px solid #dcc9b0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      min-height: 60px;
      max-height: 60%;
      height: 200px;
      overflow: hidden;
      position: relative;
      transition: height 0.3s ease, width 0.3s ease, transform 0.3s ease, padding 0.2s ease;
    }
    .input-area.collapsed {
      max-height: 0;
      padding: 0;
      border-top: none;
      min-height: 0;
      height: 0;
    }
    .editor-wrapper.layout-phone .input-area {
      width: var(--editor-width, 50%);
      max-width: var(--editor-width, 50%);
      height: 100%;
      max-height: 100%;
      min-height: 0;
      border-top: none;
      /* Editor is now the FIRST child (left side) in Phone View,
         so the divider between editor and preview is on its RIGHT edge. */
      border-right: 2px solid #dcc9b0;
      flex-shrink: 0;
    }
    .editor-wrapper.layout-phone .input-area.collapsed {
      width: 0;
      max-width: 0;
      padding: 0;
      border-right: none;
      /* Slide out to the left when collapsed. */
      transform: translateX(-100%);
      overflow: hidden;
    }
    .editor-wrapper.layout-phone .input-area.collapsed .drop-zone,
    .editor-wrapper.layout-phone .input-area.collapsed textarea { visibility: hidden; }

    .resize-handle {
      position: absolute;
      top: -4px;
      left: 0;
      right: 0;
      height: 8px;
      cursor: ns-resize;
      z-index: 10;
    }
    .editor-wrapper.layout-phone .resize-handle {
      top: 0;
      bottom: 0;
      /* Editor is now the FIRST child (left side) in Phone View,
         so the grab handle must sit on its RIGHT edge (between editor
         and preview) to be reachable from the middle of the window. */
      left: auto;
      right: -4px;
      width: 8px;
      height: auto;
      cursor: ew-resize;
    }

    // ===== AUTO-WRAP NUMBER INPUTS WITH ± BUTTONS =====
    (function wrapNumberInputs() {
      document.querySelectorAll('.settings-row input[type="number"].settings-num').forEach(function(input) {
        if (input.parentNode && input.parentNode.classList && input.parentNode.classList.contains('settings-num-group')) return;
        const group = document.createElement('span');
        group.className = 'settings-num-group';
        const minusBtn = document.createElement('button');
        minusBtn.type = 'button';
        minusBtn.className = 'settings-step-btn';
        minusBtn.textContent = '−';
        minusBtn.title = 'Decrease';
        const plusBtn = document.createElement('button');
        plusBtn.type = 'button';
        plusBtn.className = 'settings-step-btn';
        plusBtn.textContent = '+';
        plusBtn.title = 'Increase';
        input.parentNode.insertBefore(group, input);
        group.appendChild(minusBtn);
        group.appendChild(input);
        group.appendChild(plusBtn);

        function step(direction) {
          const min = input.min !== '' ? parseFloat(input.min) : -Infinity;
          const max = input.max !== '' ? parseFloat(input.max) : Infinity;
          const stepVal = input.step !== '' ? parseFloat(input.step) : 1;
          let v = parseFloat(input.value);
          if (isNaN(v)) v = 0;
          v = v + direction * stepVal;
          if (v < min) v = min;
          if (v > max) v = max;
          const decimals = (String(stepVal).split('.')[1] || '').length;
          v = parseFloat(v.toFixed(decimals));
          input.value = v;
          input.dispatchEvent(new Event('input', { bubbles: true }));
        }
        minusBtn.addEventListener('click', function(e) { e.preventDefault(); step(-1); });
        plusBtn.addEventListener('click', function(e) { e.preventDefault(); step(1); });
      });
    })();

    // ===== FILE SAVING HELPER =====
    async function saveFileWithPicker(finalName, blob, mimeType, description) {
      let safeName = (finalName || '').replace(/[<>:"/\\|?*\x00-\x1f]/g, '').trim();
      if (!safeName) safeName = 'chord-chart';

      let ext = '.txt';
      if (mimeType === 'image/png') ext = '.png';
      else if (mimeType === 'text/plain') ext = '.txt';
      else if (mimeType === 'application/json') ext = '.chordchart';

      const dotIdx = safeName.lastIndexOf('.');
      if (dotIdx < 0 || safeName.substring(dotIdx).length > 12) {
        safeName += ext;
      }

      if (window.showSaveFilePicker) {
        try {
          const handle = await window.showSaveFilePicker({
            suggestedName: safeName,
            startIn: 'downloads',
            types: [{
              description: description || 'File',
              accept: { [mimeType]: [ext] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return { saved: true, usedPicker: true, name: safeName };
        } catch (err) {
          if (err && err.name === 'AbortError') {
            return { saved: false, cancelled: true, usedPicker: true };
          }
          console.warn('Save picker failed, falling back to download:', err);
        }
      }

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = safeName;
      link.href = url;
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1500);
      return { saved: true, usedPicker: false, name: safeName };
    }

    // ===== KEY / TRANSPOSE =====
    function updateKeyDisplay() {
      const majorRoot = keySelect.value;
      const minorRoot = MINOR_KEY_MAP[majorRoot] || 'Am';
      const displayKey = currentMode === 'minor' ? minorRoot : majorRoot;
      keyDisplay.textContent = `(${displayKey})`;
    }
    function getCurrentKey() {
      const majorRoot = keySelect.value;
      if (currentMode === 'minor') {
        return MINOR_KEY_MAP[majorRoot] || majorRoot;
      }
      return majorRoot;
    }

    keySelect.addEventListener('change', function() {
      currentKey = getCurrentKey();
      updateKeyDisplay();
      resetTransposition();
    });
    keyModeSelect.addEventListener('change', function() {
      currentMode = this.value;
      currentKey = getCurrentKey();
      updateKeyDisplay();
      resetTransposition();
    });

    // ✅ FIX: strip trailing 'm' before NOTE_MAP lookup so minor keys work
    function transposeChordWithKey(chord, semitones, key) {
      if (!chord || chord === '_' || chord === '') return chord;
      if (semitones === 0) return chord;

      const match = chord.match(/^([A-G][#b]?)(.*)$/);
      if (!match) return chord;

      const root = match[1];
      const rest = match[2] || '';

      const keyRoot = (key || '').replace(/m$/, '');          // ← FIX
      const keyIndex = NOTE_MAP[keyRoot];
      const rootIndex = NOTE_MAP[root];

      if (keyIndex === undefined || rootIndex === undefined) return chord;

      let interval = (rootIndex - keyIndex + 12) % 12;
      let newKeyIndex = (keyIndex + semitones + 12) % 12;

      const validKeys = VALID_MAJOR_KEYS.filter(r => NOTE_MAP[r] === newKeyIndex);
      if (validKeys.length === 0) return chord;

      const keyHasSharp = keyRoot.includes('#');
      const keyHasFlat = keyRoot.includes('b');

      let newKey;
      if (keyHasSharp) newKey = validKeys.find(r => r.includes('#'));
      else if (keyHasFlat) newKey = validKeys.find(r => r.includes('b'));
      else newKey = validKeys.find(r => !r.includes('#') && !r.includes('b'));
      newKey = newKey || validKeys[0];

      const newKeyIndexActual = NOTE_MAP[newKey];
      let newRootIndex = (newKeyIndexActual + interval) % 12;

      const validRoots = VALID_MAJOR_KEYS.filter(r => NOTE_MAP[r] === newRootIndex);
      if (validRoots.length === 0) return chord;

      const originalHasSharp = root.includes('#');
      const originalHasFlat = root.includes('b');

      let newRoot;
      if (originalHasSharp) newRoot = validRoots.find(r => r.includes('#'));
      else if (originalHasFlat) newRoot = validRoots.find(r => r.includes('b'));
      else newRoot = validRoots.find(r => !r.includes('#') && !r.includes('b'));
      newRoot = newRoot || validRoots[0];

      return newRoot + rest;
    }

    // ✅ FIX: only transpose lines that look like chord lines (contain '|'),
    //          and use a stricter chord regex so plain lyric words like "A" aren't moved.
    const CHORD_TOKEN_RE = /^[A-G][#b]?(?:maj|min|m|dim|aug|sus|add|°|ø|Δ|\d|[#b]\d|\/[A-G][#b]?)*$/;

    function transposeText(text, semitones, key) {
      if (semitones === 0) return text;

      const lines = text.split('\n');
      const transposedLines = lines.map(line => {
        // Only transpose lines that contain a barline — those are chord lines.
        if (!line.includes('|')) return line;

        const tokens = line.split(/(\s+|\|)/);
        return tokens.map(token => {
          if (/^[|\s]+$/.test(token)) return token;
          if (CHORD_TOKEN_RE.test(token)) {
            if (token.includes('/')) {
              const parts = token.split('/');
              return parts.map(p => transposeChordWithKey(p, semitones, key)).join('/');
            }
            return transposeChordWithKey(token, semitones, key);
          }
          return token;
        }).join('');
      });

      return transposedLines.join('\n');
    }

    function applyTransposition() {
      const key = getCurrentKey();
      if (transposeSemitones === 0) {
        inputEl.value = originalText;
      } else {
        inputEl.value = transposeText(originalText, transposeSemitones, key);
      }
      updatePreview();
      transposeInfo.textContent = transposeSemitones;
    }
    function transposeUp() {
      if (transposeSemitones >= 6) return;
      transposeSemitones++;
      applyTransposition();
    }
    function transposeDown() {
      if (transposeSemitones <= -6) return;
      transposeSemitones--;
      applyTransposition();
    }
    function resetTransposition() {
      transposeSemitones = 0;
      transposeInfo.textContent = '0';
      if (originalText) {
        inputEl.value = originalText;
        updatePreview();
      }
    }

    // ===== SONG NAME =====
    function setCurrentSongName(name) {
      if (!name || !name.trim()) {
        currentSongNameEl.classList.remove('show');
        currentSongNameEl.textContent = '';
        currentSongNameEl.title = '';
        return;
      }
      const clean = name.trim();
      currentSongNameEl.textContent = clean;
      currentSongNameEl.title = 'Currently loaded song: ' + clean;
      currentSongNameEl.classList.add('show');
    }

    function loadSong(content, fileName, settingsSnapshot) {
      originalText = content;
      inputEl.value = content;
      if (settingsSnapshot && typeof settingsSnapshot === 'object') {
        settings = Object.assign({}, DEFAULT_SETTINGS, settingsSnapshot);
        saveSettings();
        syncSettingsUI();
        applySettings();
      }
      resetTransposition();
      if (fileName) setCurrentSongName(fileName);
    }

    // ===== DRAG & DROP =====
    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add('drag-over');
    }
    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('drag-over');
    }
    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('drag-over');

      const files = e.dataTransfer.files;
      if (files.length === 0) return;

      const accepted = Array.from(files).filter(file => {
        const n = file.name.toLowerCase();
        return n.endsWith('.txt') || n.endsWith('.chordchart') || n.endsWith('.json');
      });

      if (accepted.length === 0) {
        alert('Please drop .txt or .chordchart files only.');
        return;
      }

      if (accepted.length === 1) {
        const file = accepted[0];
        const reader = new FileReader();
        reader.onload = function(event) {
          const raw = event.target.result;
          const parsed = parseChordChartFile(raw, file.name);
          const fileName = stripExtension(file.name);
          const folder = file.webkitRelativePath ? getFolderPath(file.webkitRelativePath) : '';

          const storedSongs = loadStoredSongs() || [];
          const existingIndex = storedSongs.findIndex(s => s.name === fileName && s.folder === folder);
          const entry = { name: fileName, content: parsed.text, folder: folder };
          if (parsed.settings) entry.settings = parsed.settings;
          if (existingIndex >= 0) {
            storedSongs[existingIndex] = Object.assign({}, storedSongs[existingIndex], entry);
          } else {
            storedSongs.push(entry);
          }
          saveSongsToStorage(storedSongs);

          loadSong(parsed.text, fileName, parsed.settings);
          if (parsed.settings) showToast('Applied settings from "' + fileName + '"');
          displayStoredSongs();
        };
        reader.readAsText(file);
        return;
      }

      const storedSongs = loadStoredSongs() || [];
      let loadedCount = 0;
      let firstParsed = null;
      let firstFileName = '';

      accepted.forEach((file) => {
        const reader = new FileReader();
        reader.onload = function(event) {
          const raw = event.target.result;
          const parsed = parseChordChartFile(raw, file.name);
          const fileName = stripExtension(file.name);
          const folder = file.webkitRelativePath ? getFolderPath(file.webkitRelativePath) : '';

          const existingIndex = storedSongs.findIndex(s => s.name === fileName && s.folder === folder);
          const entry = { name: fileName, content: parsed.text, folder: folder };
          if (parsed.settings) entry.settings = parsed.settings;
          if (existingIndex >= 0) {
            storedSongs[existingIndex] = Object.assign({}, storedSongs[existingIndex], entry);
          } else {
            storedSongs.push(entry);
          }

          if (loadedCount === 0) {
            firstParsed = parsed;
            firstFileName = fileName;
          }
          loadedCount++;
          if (loadedCount === accepted.length) {
            saveSongsToStorage(storedSongs);
            displayStoredSongs();
            if (firstParsed) {
              loadSong(firstParsed.text, firstFileName, firstParsed.settings);
              if (firstParsed.settings) showToast('Applied settings from "' + firstFileName + '"');
            }
          }
        };
        reader.readAsText(file);
      });
    }

    document.addEventListener('dragover', function(e) { e.preventDefault(); });
    document.addEventListener('drop', function(e) { e.preventDefault(); });

    dropZone.addEventListener('dragover', handleDragOver);
    dropZone.addEventListener('dragleave', handleDragLeave);
    dropZone.addEventListener('drop', handleDrop);

    // ===== FILE PARSER =====
    function stripExtension(filename) {
      return filename.replace(/\.(txt|chordchart|json)$/i, '');
    }
    function parseChordChartFile(raw, filename) {
      let parsed = null;
      const trimmed = (raw || '').trim();
      if (trimmed.startsWith('{')) {
        try { parsed = JSON.parse(trimmed); } catch (e) { parsed = null; }
      }
      if (parsed && parsed.app === 'chord-chart-creator' && parsed.type === 'song' && typeof parsed.songText === 'string') {
        return {
          text: parsed.songText,
          settings: (parsed.settings && typeof parsed.settings === 'object') ? parsed.settings : null
        };
      }
      return { text: raw, settings: null };
    }

    // ===== STORED SONGS =====
    function loadStoredSongs() {
      try {
        const stored = localStorage.getItem('chordChartSongs');
        if (stored) return JSON.parse(stored);
      } catch (e) { console.log('Could not load stored songs'); }
      return null;
    }
    function saveSongsToStorage(songs) {
      try { localStorage.setItem('chordChartSongs', JSON.stringify(songs)); }
      catch (e) { console.log('Could not save songs'); }
    }

    function removeSong(songName, songFolder) {
      const storedSongs = loadStoredSongs() || [];
      const index = storedSongs.findIndex(s => s.name === songName && s.folder === (songFolder || ''));
      if (index >= 0) {
        showConfirm('Are you sure you want to remove "' + songName + '"?', function() {
          storedSongs.splice(index, 1);
          saveSongsToStorage(storedSongs);
          displayStoredSongs();
        });
      }
    }

    function getFolderPath(filePath) {
      const parts = filePath.split(/[\/\\]/);
      parts.pop();
      return parts.join('/');
    }

    function displayStoredSongs() {
      const storedSongs = loadStoredSongs();
      songsList.innerHTML = '';

      if (storedSongs && storedSongs.length > 0) {
        const tree = {};
        storedSongs.forEach(song => {
          const folder = song.folder || '';
          if (folder === '') {
            if (!tree._root) tree._root = [];
            tree._root.push(song);
          } else {
            const parts = folder.split('/').filter(p => p !== '');
            let current = tree;
            for (let part of parts) {
              if (!current[part]) current[part] = {};
              current = current[part];
            }
            if (!current._songs) current._songs = [];
            current._songs.push(song);
          }
        });

        const folderNames = Object.keys(tree).filter(k => k !== '_root');
        folderNames.sort((a, b) => a.localeCompare(b, 'th', { sensitivity: 'base' }));

        folderNames.forEach(folderName => {
          const folderItem = document.createElement('div');
          folderItem.className = 'dropdown-item folder-item';
          folderItem.textContent = folderName;

          const arrow = document.createElement('span');
          arrow.className = 'folder-arrow';
          arrow.textContent = '▶';
          folderItem.appendChild(arrow);

          const popup = document.createElement('div');
          popup.className = 'subfolder-popup';

          const subTree = tree[folderName];
          if (subTree._songs) {
            subTree._songs.sort((a, b) => a.name.localeCompare(b.name, 'th', { sensitivity: 'base' }));
            subTree._songs.forEach(song => popup.appendChild(createSongItem(song)));
          }

          const subFolderNames = Object.keys(subTree).filter(k => k !== '_songs');
          subFolderNames.sort((a, b) => a.localeCompare(b.name, 'th', { sensitivity: 'base' }));

          subFolderNames.forEach(subFolderName => {
            const subFolderTree = subTree[subFolderName];
            const subFolderItem = document.createElement('div');
            subFolderItem.className = 'dropdown-item folder-item';
            subFolderItem.textContent = subFolderName;
            const subArrow = document.createElement('span');
            subArrow.className = 'folder-arrow';
            subArrow.textContent = '▶';
            subFolderItem.appendChild(subArrow);

            const subPopup = document.createElement('div');
            subPopup.className = 'subfolder-popup';

            if (subFolderTree._songs) {
              subFolderTree._songs.sort((a, b) => a.name.localeCompare(b.name, 'th', { sensitivity: 'base' }));
              subFolderTree._songs.forEach(song => subPopup.appendChild(createSongItem(song)));
            }

            subFolderItem.appendChild(subPopup);
            subFolderItem.addEventListener('mouseenter', function() {
              document.querySelectorAll('.subfolder-popup.show').forEach(p => { if (p !== subPopup) p.classList.remove('show'); });
              subPopup.style.top = '0px';
              subPopup.style.left = '100%';
              subPopup.classList.add('show');
            });
            subFolderItem.addEventListener('mouseleave', function() {
              setTimeout(() => { if (!subPopup.matches(':hover') && !subFolderItem.matches(':hover')) subPopup.classList.remove('show'); }, 300);
            });
            subPopup.addEventListener('mouseenter', function() { subPopup.classList.add('show'); });
            subPopup.addEventListener('mouseleave', function() {
              setTimeout(() => { if (!subFolderItem.matches(':hover')) subPopup.classList.remove('show'); }, 300);
            });

            popup.appendChild(subFolderItem);
          });

          folderItem.appendChild(popup);
          folderItem.addEventListener('mouseenter', function() {
            document.querySelectorAll('.subfolder-popup.show').forEach(p => { if (p !== popup) p.classList.remove('show'); });
            popup.style.top = '0px';
            popup.style.left = '100%';
            popup.classList.add('show');
          });
          folderItem.addEventListener('mouseleave', function() {
            setTimeout(() => { if (!popup.matches(':hover') && !folderItem.matches(':hover')) popup.classList.remove('show'); }, 300);
          });
          popup.addEventListener('mouseenter', function() { popup.classList.add('show'); });
          popup.addEventListener('mouseleave', function() {
            setTimeout(() => { if (!folderItem.matches(':hover')) popup.classList.remove('show'); }, 300);
          });

          songsList.appendChild(folderItem);
        });

        if (tree._root) {
          tree._root.sort((a, b) => a.name.localeCompare(b.name, 'th', { sensitivity: 'base' }));
          tree._root.forEach(song => songsList.appendChild(createSongItem(song)));
        }
      } else {
        const emptyMsg = document.createElement('div');
        emptyMsg.className = 'dropdown-item';
        emptyMsg.style.cssText = 'color: #b0987a; font-size: 0.8rem; padding: 6px 16px; font-style: italic;';
        emptyMsg.textContent = 'No songs loaded';
        songsList.appendChild(emptyMsg);
      }
    }

    function createSongItem(song) {
      const songItem = document.createElement('div');
      songItem.className = 'dropdown-item song-item';
      if (song.settings && typeof song.settings === 'object') songItem.classList.add('has-settings');

      const nameSpan = document.createElement('span');
      nameSpan.className = 'song-name';
      nameSpan.textContent = song.name;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '✕';
      removeBtn.title = 'Remove this song';
      removeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        removeSong(song.name, song.folder || '');
      });

      nameSpan.addEventListener('click', function(e) {
        e.stopPropagation();
        loadSong(song.content, song.name, song.settings || null);
        if (song.settings && typeof song.settings === 'object') showToast('Applied settings from "' + song.name + '"');
        dropdownContent.classList.remove('show');
        document.querySelectorAll('.dropdown-item.song-item').forEach(el => el.classList.remove('active'));
        songItem.classList.add('active');
      });

      songItem.appendChild(removeBtn);
      songItem.appendChild(nameSpan);
      return songItem;
    }

    dropdownToggle.addEventListener('click', function(e) {

    document.getElementById('loadSingleFile').addEventListener('click', function(e) {
      e.stopPropagation();
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = '.txt,.chordchart,.json';

      fileInput.onchange = function(e) {
        const file = e.target.files[0];

        const reader = new FileReader();
        reader.onload = function(event) {
          const raw = event.target.result;
          const parsed = parseChordChartFile(raw, file.name);
          const fileName = stripExtension(file.name);
          const folder = file.webkitRelativePath ? getFolderPath(file.webkitRelativePath) : '';
          const storedSongs = loadStoredSongs() || [];
          const existingIndex = storedSongs.findIndex(s => s.name === fileName && s.folder === folder);
          const entry = { name: fileName, content: parsed.text, folder: folder };

          if (existingIndex >= 0) {

          } else {
            storedSongs.push(entry);
          }
          saveSongsToStorage(storedSongs);

          if (parsed.settings) showToast('Applied settings from "' + fileName + '"');

        reader.readAsText(file);
      };

    // ===== RESIZE HANDLE =====
    resizeHandle.addEventListener('mousedown', function(e) {
      isResizing = true;
      startY = e.clientY;
      startX = e.clientX;
      startHeight = inputArea.offsetHeight;
      startWidth = inputArea.offsetWidth;
      document.body.style.cursor = currentLayout === 'phone' ? 'ew-resize' : 'ns-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!isResizing) return;
      if (currentLayout === 'phone') {
        const deltaX = e.clientX - startX;
        let newWidth = startWidth + deltaX;
        const wrapperWidth = editorWrapper.offsetWidth || 1;
        let newPercent = (newWidth / wrapperWidth) * 100;
        newPercent = Math.max(10, Math.min(90, newPercent));
        newPercent = Math.round(newPercent);
        settings.editorWidth = newPercent;
        editorWidthSlider.value = newPercent;
        if (document.activeElement !== editorWidthNum) editorWidthNum.value = newPercent.toFixed(0);
        saveSettings();
        document.documentElement.style.setProperty('--editor-width', newPercent + '%');
        clearTimeout(window._resizeTimeout);
        window._resizeTimeout = setTimeout(adjustChordSizes, 100);
      } else {
        const deltaY = startY - e.clientY;
        let newHeight = startHeight + deltaY;
        newHeight = Math.max(60, Math.min(window.innerHeight * 0.7, newHeight));
        inputArea.style.height = newHeight + 'px';
        inputArea.style.maxHeight = newHeight + 'px';
        clearTimeout(window._resizeTimeout);
        window._resizeTimeout = setTimeout(adjustChordSizes, 100);
      }
    });
    document.addEventListener('mouseup', function() {
      if (isResizing) {
        isResizing = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        if (currentLayout === 'phone') {
          editorWidthSlider.value = settings.editorWidth;
          if (document.activeElement !== editorWidthNum) editorWidthNum.value = settings.editorWidth.toFixed(0);
        }
        setTimeout(adjustChordSizes, 150);

    function applyEditorState(hidden) {
      isEditorCollapsed = hidden;
      inputArea.classList.toggle('collapsed', hidden);
      toggleBtn.textContent = hidden ? '▼ ✏️ Show Editor' : '▲ ✏️ Hide Editor';
      toggleBtn.classList.toggle('active', hidden);

    // ✅ Phone view = vertical split: editor on LEFT, preview on RIGHT.
    //    We reorder the DOM (editor first) so flex-direction: row puts them
    //    in that order without needing row-reverse or CSS gymnastics.
    //    Desktop view = normal stacked layout: preview on top, editor below.
    function applyLayout(layout) {
      currentLayout = (layout === 'phone') ? 'phone' : 'desktop';
      editorWrapper.classList.remove('layout-phone', 'layout-desktop');
      editorWrapper.classList.add('layout-' + currentLayout);

      if (currentLayout === 'phone') {
        // Editor first, preview second → editor on the LEFT
        editorWrapper.insertBefore(inputArea, previewArea);
      } else {
        // Preview first, editor second → preview on TOP
        editorWrapper.insertBefore(previewArea, inputArea);
      }

      // Button text shows the view you'd switch TO

      toggleLayoutBtn.classList.toggle('active', currentLayout === 'phone');
      // Re-apply collapsed state so the correct hide animation runs in the new orientation
      applyEditorState(isEditorCollapsed);
      saveLayoutState(currentLayout);
      setTimeout(adjustChordSizes, 350);
    }

    // ===== SECTION LABEL SYSTEM =====
    function expandSectionShortcut(name) {
      const trimmed = name.trim();
      const lower = trimmed.toLowerCase();

      const numberMap = {
        '21': 'Verse 1','22': 'Verse 2','23': 'Verse 3','24': 'Verse 4','25': 'Verse 5',
        '26': 'Verse 6','27': 'Verse 7','28': 'Verse 8','29': 'Verse 9',
        '31': 'Pre-Chorus 1','32': 'Pre-Chorus 2','33': 'Pre-Chorus 3','34': 'Pre-Chorus 4','35': 'Pre-Chorus 5',
        '36': 'Pre-Chorus 6','37': 'Pre-Chorus 7','38': 'Pre-Chorus 8','39': 'Pre-Chorus 9',
        '41': 'Chorus 1','42': 'Chorus 2','43': 'Chorus 3','44': 'Chorus 4','45': 'Chorus 5',
        '46': 'Chorus 6','47': 'Chorus 7','48': 'Chorus 8','49': 'Chorus 9',
        '51': 'Post-Chorus 1','52': 'Post-Chorus 2','53': 'Post-Chorus 3','54': 'Post-Chorus 4','55': 'Post-Chorus 5',
        '56': 'Post-Chorus 6','57': 'Post-Chorus 7','58': 'Post-Chorus 8','59': 'Post-Chorus 9',
        '61': 'Instrumental 1','62': 'Instrumental 2','63': 'Instrumental 3','64': 'Instrumental 4','65': 'Instrumental 5',
        '66': 'Instrumental 6','67': 'Instrumental 7','68': 'Instrumental 8','69': 'Instrumental 9',
        '71': 'Bridge 1','72': 'Bridge 2','73': 'Bridge 3','74': 'Bridge 4','75': 'Bridge 5',
        '76': 'Bridge 6','77': 'Bridge 7','78': 'Bridge 8','79': 'Bridge 9'
      };
      const singleNumberMap = {
        '1': 'Intro','2': 'Verse','3': 'Pre-Chorus','4': 'Chorus',
        '5': 'Post-Chorus','6': 'Instrumental','7': 'Bridge','8': 'Outro'
      };
      const textShortcuts = {
        'int': 'Intro','i': 'Intro','v': 'Verse','ver': 'Verse','pr': 'Pre-Chorus','pre': 'Pre-Chorus',
        'ch': 'Chorus','cho': 'Chorus','po': 'Post-Chorus','post': 'Post-Chorus','b': 'Bridge','bri': 'Bridge',
        'ins': 'Instrumental','inst': 'Instrumental','out': 'Outro','o': 'Outro','tag': 'Tag','t': 'Tag',
        'end': 'Ending','ending': 'Ending'
      };

      if (lower.match(/^[2-7][1-9]$/)) return numberMap[lower] || name;
      if (lower.match(/^[1-8]$/)) return singleNumberMap[lower] || name;
      const match = lower.match(/^(int|i|v|ver|pr|pre|ch|cho|po|post|b|bri|ins|inst|out|o|tag|t|end|ending)(?:\s*(\d+))?$/);
      if (match) {
        const shortcut = match[1];
        const number = match[2] || '';
        let fullName = textShortcuts[shortcut] || shortcut;
        fullName = fullName.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        return number ? `${fullName} ${number}` : fullName;
      }
      const fullMatch = lower.match(/^(intro|verse|pre-chorus|chorus|post-chorus|bridge|instrumental|outro|tag|ending)(?:\s*(\d+))?$/);
      if (fullMatch) {
        const fullName = fullMatch[1];
        const number = fullMatch[2] || '';
        const capitalized = fullName.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        return number ? `${capitalized} ${number}` : capitalized;
      }
      return name;
    }

    function getSectionClass(sectionName) {
      const name = sectionName.toLowerCase().trim();
      if (name.includes('intro')) return 'section-intro';
      if (name.includes('verse')) return 'section-verse';
      if (name.includes('pre-chorus')) return 'section-pre-chorus';
      if (name.includes('post-chorus')) return 'section-post-chorus';
      if (name.includes('chorus')) return 'section-chorus';
      if (name.includes('bridge')) return 'section-bridge';
      if (name.includes('instrumental')) return 'section-instrumental';
      if (name.includes('outro')) return 'section-outro';
      return '';
    }

    // ===== CHORD SIMPLIFICATION =====
    function normalizeChord(chord) {
      if (!chord || chord === '_' || chord === '') return chord;
      const match = chord.match(/^([a-gA-G])([#b]?)(.*)$/);
      if (match) {
        const root = match[1].toUpperCase();
        const accidental = match[2];
        const rest = match[3];
        return root + accidental + rest;
      }
      return chord;
    }
    function simplifyChord(chord) {
      if (!chord || chord === '_' || chord === '') return chord;
      let simplified = normalizeChord(chord);
      if (simplified.match(/[A-G][#b]?d\b/i) || simplified.match(/[A-G][#b]?dim\b/i) || simplified.includes('°')) {
        simplified = simplified.replace(/d|dim|°/gi, '°');
        return simplified.trim();
      }
      if (simplified.match(/[A-G][#b]?h\b/i) || simplified.toLowerCase().includes('halfdim') || simplified.toLowerCase().includes('half-dim') || simplified.toLowerCase().includes('half diminished') || simplified.includes('ø')) {
        return simplified.replace(/h|halfdim|half-dim|half diminished|half-diminished|ø/gi, 'ø').trim();
      }
      if (simplified.match(/[A-G][#b]?M7?\b/)) {
        simplified = simplified.replace(/M7?/g, 'Δ');
        return simplified.trim();
      }
      if (simplified.match(/[A-G][#b]?Maj7\b/i) || simplified.match(/[A-G][#b]?maj7\b/i) || simplified.includes('Δ')) {
        simplified = simplified.replace(/Maj7|maj7|Δ7|Δ/gi, 'Δ');
        return simplified.trim();
      }
      return simplified;
    }

    function getChordFontStackForMeasure() {
      return effectiveFont(settings.chordFont, settings.chordFontCustom);
    }

    // ===== CHORD AUTO-SIZING =====
    function adjustChordSizes() {
      const content = previewContent;
      if (!content) return;

      const chordLines = content.querySelectorAll('.chord-line');
      if (chordLines.length === 0) return;

      const previewWidth = previewContent.clientWidth || 0;
      if (previewWidth < 50) return;

      const maxSize = 2.5;

      let globalMaxText = '';
      chordLines.forEach(row => {
        const toks = row.querySelectorAll('.chord-token');
        toks.forEach(t => {
          const text = t.textContent || '';
          if (text.length > globalMaxText.length) globalMaxText = text;
        });
      });
      if (!globalMaxText) globalMaxText = 'X';

      const chordFontStack = getChordFontStackForMeasure();

      const testSpan = document.createElement('span');
      testSpan.style.cssText = `position:absolute; visibility:hidden; white-space:nowrap; font-family: ${chordFontStack}; font-weight: 700;`;
      testSpan.textContent = globalMaxText;
      document.body.appendChild(testSpan);

      let low = 0.3;
      let high = maxSize * 2;
      let bestSize = maxSize * 0.5;
      const iterations = 30;
      const targetTokenWidth = Math.max(40, previewWidth * 0.20);

      for (let i = 0; i < iterations; i++) {
        const mid = (low + high) / 2;
        testSpan.style.fontSize = mid + 'rem';
        const w = testSpan.offsetWidth;
        if (w <= targetTokenWidth) {
          bestSize = mid;
          low = mid;
        } else {
          high = mid;
        }
      }
      document.body.removeChild(testSpan);

      const mult = parseFloat(settings.chordSizeMult) || 1;
      const ms = parseFloat(settings.masterScale) || 1;
      const finalSize = bestSize * mult * ms;

      chordLines.forEach(row => {
        row.querySelectorAll('.chord-token, .space, .pipe').forEach(t => {
          t.style.fontSize = Math.round(finalSize * 100) / 100 + 'rem';
        });
      });
    }

    // ===== RENDER =====
    function renderChordLine(line, sectionClass) {
      let html = `<div class="chord-line">`;
      const tokens = line.match(/(\s+|\S+)/g) || [];
      for (const token of tokens) {
        if (/^\s+$/.test(token)) {
          for (let i = 0; i < token.length; i++) html += `<span class="space"></span>`;
          continue;
        }
        if (/^\|+$/.test(token)) {
          html += `<span class="pipe">${token}</span>`;
          continue;
        }
        const simplified = simplifyChord(token);
        const isUnderscore = simplified === '_' || simplified === '';
        const displayText = isUnderscore ? '_' : simplified;
        let classes = 'chord-token';
        if (isUnderscore) classes += ' empty';
        if (sectionClass) classes += ` ${sectionClass}`;
        html += `<span class="${classes}">${displayText}</span>`;
      }
      html += `</div>`;
      return html;
    }

    function renderPreview(text) {
      if (!text || text.trim() === '') {
        previewContent.innerHTML = `
          <div class="empty-preview">
            <div class="main-text">Type or Paste your chord chart (in the editor area below)</div>
            <div class="sub-text">or Drag &amp; Drop a chord chart (.txt or .chordchart)<br>Tip: to reuse the current look for a new song, clear the text and type the new one — settings stay.</div>
          </div>
        `;
        return;
      }
      let html = '';
      const lines = text.split('\n');
      currentSection = '';

      for (let line of lines) {
        const trimmed = line.trim();
        if (trimmed === '---' || trimmed === '___' || trimmed === '***') {
          html += `<div class="hr-line"><span class="hr"></span></div>`;
          continue;
        }
        if (trimmed === '') {
          html += `<div class="empty-line"></div>`;
          continue;
        }
        const customLabelMatch = trimmed.match(/^\[(.*?)\]$/);
        if (customLabelMatch) {
          const labelText = customLabelMatch[1].trim();
          html += `<div class="section-block section-custom"><span class="section"><span class="section-name">${labelText}</span></span></div>`;
          currentSection = 'custom';
          continue;
        }

        const sectionNameMatch = trimmed.match(/^(Intro|Verse|Pre-Chorus|Chorus|Post-Chorus|Bridge|Outro|Instrumental|Tag|Ending|Coda)/i);
        if (sectionNameMatch) {
          const sectionName = sectionNameMatch[1].trim();
          const rest = trimmed.substring(sectionName.length).trim();
          const restWordCount = rest ? rest.split(/\s+/).filter(w => w).length : 0;

          let isLabel = false;
          if (!rest) isLabel = true;
          else if (rest.match(/^\d+\s*$/)) isLabel = true;
          else if (rest.match(/^[\(\[].*[\)\]]\s*$/)) isLabel = true;
          else if (rest.match(/^\d+\s*[\(\[].*[\)\]]\s*$/)) isLabel = true;
          else if (restWordCount <= 3 && !rest.match(/[.!?,;:]/)) isLabel = true;

          if (isLabel) {
            let displayName = sectionName.charAt(0).toUpperCase() + sectionName.slice(1);
            currentSection = displayName;
            const sectionClass = getSectionClass(displayName);

            if (!rest) {
              html += `<div class="section-block ${sectionClass}"><span class="section"><span class="section-name">${displayName}</span></span></div>`;
            } else {
              const numberMatch = rest.match(/^(\d+)\s*(.*)$/);
              let boldPart = displayName;
              let thinPart = rest;
              if (numberMatch) {
                const number = numberMatch[1];
                const restAfterNumber = numberMatch[2] ? numberMatch[2].trim() : '';
                boldPart = displayName + ' ' + number;
                thinPart = restAfterNumber;
              }
              let fullLabel = `<span class="section-name">${boldPart}</span>`;
              if (thinPart) fullLabel += ` <span class="section-extra">${thinPart}</span>`;
              html += `<div class="section-block ${sectionClass}"><span class="section">${fullLabel}</span></div>`;
            }
            continue;
          }
        }

        const numberShortcutMatch = trimmed.match(/^\s*([2-7][1-9]|[1-8])\s*(.*)$/i);
        if (numberShortcutMatch) {
          const shortcut = numberShortcutMatch[1].trim();
          let extraText = numberShortcutMatch[2] ? numberShortcutMatch[2].trim() : '';
          const expandedName = expandSectionShortcut(shortcut);
          currentSection = expandedName;
          const sectionClass = getSectionClass(expandedName);

          const numberMatch = extraText.match(/^(\d+)\s*(.*)$/);
          let boldPart = expandedName;
          let thinPart = extraText;
          if (numberMatch) {
            const number = numberMatch[1];
            const restAfterNumber = numberMatch[2] ? numberMatch[2].trim() : '';
            boldPart = expandedName + ' ' + number;
            thinPart = restAfterNumber;
          }
          let fullLabel = `<span class="section-name">${boldPart}</span>`;
          if (thinPart) fullLabel += ` <span class="section-extra">${thinPart}</span>`;
          html += `<div class="section-block ${sectionClass}"><span class="section">${fullLabel}</span></div>`;
          continue;
        }

        if (line.includes('|')) {
          let sectionClass = getSectionClass(currentSection);
          if (currentSection === 'custom' || currentSection.toLowerCase().includes('custom')) sectionClass = 'section-custom';
          html += renderChordLine(line, sectionClass);
        } else {
          html += `<div class="lyrics-line"><span class="lyric-text">${trimmed}</span></div>`;
        }
      }
      previewContent.innerHTML = html;
      requestAnimationFrame(() => { setTimeout(adjustChordSizes, 50); });
    }

    function updatePreview() { renderPreview(inputEl.value); }

    // ===== SAVE CHORD CHART =====
    document.getElementById('saveSong').addEventListener('click', async function() {
      const content = inputEl.value;
      if (!content || content.trim() === '') {
        alert('Nothing to save. The editor is empty.');
        return;
      }
      const songName = currentSongNameEl && currentSongNameEl.classList.contains('show')
        ? (currentSongNameEl.textContent || 'chord-chart')
        : 'chord-chart';
      const sanitizedName = songName.replace(/[<>:"/\\|?*\x00-\x1f]/g, '').trim() || 'chord-chart';
      const timestamp = new Date().toISOString().slice(0, 10);
      const fileName = `${sanitizedName}_${timestamp}.chordchart`;

      const payload = {
        app: 'chord-chart-creator',
        version: 1,
        type: 'song',
        savedAt: new Date().toISOString(),
        settings: Object.assign({}, settings),
        songText: content
      };

      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const result = await saveFileWithPicker(fileName, blob, 'application/json', 'Chord chart');
      if (result.cancelled) return;

      const originalLabel = this.textContent;
      this.textContent = '✅ Saved!';
      setTimeout(() => { this.textContent = originalLabel; }, 2000);
    });

    // ===== SAVE AS PNG =====
    // ✅ FIX: wrap in try/finally so styles always restore, even on cancel/error
    document.getElementById('exportPNG').addEventListener('click', async function() {
      const preview = document.getElementById('previewContainer');
      const contentWrapper = document.getElementById('previewContent');
      const songName = currentSongNameEl && currentSongNameEl.classList.contains('show')
        ? (currentSongNameEl.textContent || 'chord-chart')
        : 'chord-chart';
      const originalLabel = this.textContent;
      this.textContent = '⏳ Exporting...';
      this.disabled = true;

      const originalStyles = {
        height: preview.style.height,
        maxHeight: preview.style.maxHeight,
        overflow: preview.style.overflow,
        padding: preview.style.padding,
        border: preview.style.border,
        borderRadius: preview.style.borderRadius,
        boxShadow: preview.style.boxShadow,
        background: preview.style.background,
        width: preview.style.width
      };

      function restoreStyles() {
        preview.style.height = originalStyles.height || '';
        preview.style.maxHeight = originalStyles.maxHeight || '';
        preview.style.overflow = originalStyles.overflow || '';
        preview.style.padding = originalStyles.padding || '';
        preview.style.border = originalStyles.border || '';
        preview.style.borderRadius = originalStyles.borderRadius || '';
        preview.style.boxShadow = originalStyles.boxShadow || '';
        preview.style.background = originalStyles.background || '';
        preview.style.width = originalStyles.width || '';
      }

      try {
        preview.style.height = 'auto';
        preview.style.maxHeight = 'none';
        preview.style.overflow = 'visible';
        preview.style.padding = '40px';
        preview.style.border = 'none';
        preview.style.borderRadius = '0';
        preview.style.boxShadow = 'none';
        preview.style.background = '#ffffff';
        preview.offsetHeight;

        const fullWidth = contentWrapper.scrollWidth || preview.scrollWidth;
        const fullHeight = contentWrapper.scrollHeight || preview.scrollHeight;
        const padding = 40;
        const totalWidth = fullWidth + (padding * 2);
        const totalHeight = fullHeight + (padding * 2);

        preview.style.width = totalWidth + 'px';
        preview.style.height = totalHeight + 'px';

        const canvas = await html2canvas(preview, {
          scale: 2,
          backgroundColor: '#ffffff',
          useCORS: true,
          logging: false,
          width: totalWidth,
          height: totalHeight,
          allowTaint: false,
          foreignObjectRendering: false,
          onclone: function(doc) {
            const container = doc.getElementById('previewContainer');
            if (container) {
              container.style.padding = '40px';
              container.style.background = '#ffffff';
              container.style.border = 'none';
              container.style.borderRadius = '0';
              container.style.boxShadow = 'none';
              container.style.height = 'auto';
              container.style.maxHeight = 'none';
              container.style.overflow = 'visible';
              container.style.width = totalWidth + 'px';
            }
          }
        });

        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));

        const sanitizedName = songName.replace(/[<>:"/\\|?*\x00-\x1f]/g, '').trim() || 'chord-chart';
        const timestamp = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
        const fileName = `${sanitizedName}_${timestamp}.png`;

        const result = await saveFileWithPicker(fileName, blob, 'image/png', 'PNG image');
        if (result.cancelled) return;  // finally will still restore

        this.textContent = '✅ Exported!';
        setTimeout(() => {
          this.textContent = originalLabel;
          this.disabled = false;
        }, 2000);
      } catch (err) {
        console.error('Export failed:', err);
        this.textContent = '❌ Export failed';
        setTimeout(() => {
          this.textContent = originalLabel;
          this.disabled = false;
        }, 2000);
      } finally {
        restoreStyles();
      }
    });

    // ===== TRANSPOSE BUTTONS =====
    transposeUpBtn.addEventListener('click', transposeUp);
    transposeDownBtn.addEventListener('click', transposeDown);

    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && (e.key === 'ArrowUp' || e.key === '=' || e.key === '+')) {
        e.preventDefault();
        transposeUp();
      }
      if (e.ctrlKey && e.shiftKey && (e.key === 'ArrowDown' || e.key === '-' || e.key === '_')) {
        e.preventDefault();
        transposeDown();
      }
      if (e.key === 'Escape' && settingsOverlay.classList.contains('show')) {
        closeSettings();
      }
    });

    // ===== INIT =====
    loadSettings();
    syncSettingsUI();
    applySettings();
    applyLockState();
    applyLayout(loadLayoutState());   // ✅ FIX: restore saved layout

    applyMode(false);

    displayStoredSongs();
    originalText = inputEl.value;
    currentKey = getCurrentKey();
    updateKeyDisplay();
    resetTransposition();

    inputEl.addEventListener('input', function() {
      originalText = inputEl.value;
      transposeSemitones = 0;
      transposeInfo.textContent = '0';
      updatePreview();
    });

    updatePreview();
    window.addEventListener('load', function() {
      setTimeout(adjustChordSizes, 500);
      setTimeout(adjustChordSizes, 1500);
    });

    let resizeTimeout;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(adjustChordSizes, 100);
    });
  })();
</script>
</body>
</html>
