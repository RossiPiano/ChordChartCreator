<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎸 Chord Chart Creator</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: var(--font-chord, 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Menlo', 'Consolas', 'Roboto Mono', 'DejaVu Sans Mono', monospace);
      margin: 0;
      padding: 0;
    }
    :root {
      --font-chord: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Menlo', 'Consolas', 'Roboto Mono', 'DejaVu Sans Mono', monospace;
      --font-lyric: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Menlo', 'Consolas', 'Roboto Mono', 'DejaVu Sans Mono', monospace;
      --chord-size-mult: 1;
      --lyric-size: 0.85rem;
      --label-size: 1rem;
      --label-radius: 4px;
      --barline-width: 5px;
      --barline-height-mult: 2;
      --ui-scale: 1;
      --editor-scale: 1;
    }
    html {
      font-size: clamp(14px, 1.05vw + 8px, 18px);
    }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #d4c5a0;
      padding: 0;
      margin: 0;
    }
    .app {
      max-width: none;
      width: 100vw;
      height: 100vh;
      background: #f5ede0;
      border-radius: 0;
      box-shadow: none;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: none;
    }
    .toolbar {
      background: #e8dccc;
      padding: calc(10px * var(--ui-scale)) calc(18px * var(--ui-scale));
      border-bottom: 2px solid #dcc9b0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: calc(8px * var(--ui-scale)) calc(12px * var(--ui-scale));
      flex-shrink: 0;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: calc(10px * var(--ui-scale));
      flex-wrap: wrap;
      width: 100%;
    }
    .toolbar h1 {
      font-size: calc(1.0rem * var(--ui-scale));
      font-weight: 600;
      color: #5c4033;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: calc(6px * var(--ui-scale));
      margin-right: calc(6px * var(--ui-scale));
    }
    .btn {
      background: #dcc9b0;
      border: 1px solid #c4ad92;
      padding: calc(5px * var(--ui-scale)) calc(14px * var(--ui-scale));
      border-radius: 40px;
      font-size: calc(0.85rem * var(--ui-scale));
      font-weight: 500;
      color: #3d2b1f;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: calc(4px * var(--ui-scale));
      white-space: nowrap;
    }
    .btn:hover {
      background: #c4ad92;
      border-color: #b0987a;
    }
    .btn-success {
      background: #8b6b4a;
      border-color: #7a5d3f;
      color: white;
    }
    .btn-success:hover {
      background: #7a5d3f;
      border-color: #6b4f35;
    }
    .btn-success:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #c4ad92;
      color: #5c4033;
    }
    .btn-outline:hover {
      background: #dcc9b0;
      border-color: #b0987a;
    }
    .btn.active {
      background: #5c4033;
      border-color: #4a3328;
      color: white;
    }
    .btn-toggle {
      background: #dcc9b0;
      border: 1px solid #c4ad92;
      padding: calc(5px * var(--ui-scale)) calc(14px * var(--ui-scale));
      border-radius: 40px;
      font-size: calc(0.85rem * var(--ui-scale));
      font-weight: 500;
      color: #3d2b1f;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: calc(4px * var(--ui-scale));
      white-space: nowrap;
    }
    .btn-toggle:hover {
      background: #c4ad92;
      border-color: #b0987a;
    }
    .btn-toggle.active {
      background: #5c4033;
      border-color: #4a3328;
      color: white;
    }
    .btn-transpose {
      background: #8b6b4a;
      border-color: #7a5d3f;
      color: white;
      font-weight: 700;
      min-width: calc(34px * var(--ui-scale));
      justify-content: center;
      padding: calc(5px * var(--ui-scale)) calc(8px * var(--ui-scale));
      font-size: calc(0.9rem * var(--ui-scale));
    }
    .btn-transpose:hover {
      background: #7a5d3f;
      border-color: #6b4f35;
    }
    .transpose-info {
      font-size: calc(0.8rem * var(--ui-scale));
      color: #5c4033;
      background: #dcc9b0;
      padding: calc(4px * var(--ui-scale)) calc(10px * var(--ui-scale));
      border-radius: 40px;
      font-weight: 500;
      min-width: calc(28px * var(--ui-scale));
      text-align: center;
    }
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #f5ede0;
      min-width: calc(260px * var(--ui-scale));
      max-width: min(calc(560px * var(--ui-scale)), 90vw);
      width: max-content;
      max-height: 400px;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      border-radius: 8px;
      border: 1px solid #dcc9b0;
      z-index: 100;
      padding: 6px 0;
      margin-top: 4px;
    }
    .dropdown-content.show {
      display: block;
    }
    .dropdown-content .dropdown-item {
      padding: calc(8px * var(--ui-scale)) calc(16px * var(--ui-scale));
      font-size: calc(0.85rem * var(--ui-scale));
      font-weight: 500;
      color: #5c4033;
      cursor: pointer;
      transition: background 0.1s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }
    .dropdown-content .dropdown-item:hover {
      background: #ece0cf;
    }
    .dropdown-content .dropdown-item.active {
      background: #5c4033;
      color: white;
    }
    .dropdown-content .dropdown-item.song-item {
      padding-left: calc(6px * var(--ui-scale));
      padding-right: calc(12px * var(--ui-scale));
      font-size: calc(0.8rem * var(--ui-scale));
      display: flex;
      align-items: center;
      gap: calc(6px * var(--ui-scale));
    }
    .dropdown-content .dropdown-item.song-item .song-name {
      flex: 1 1 auto;
      min-width: 0;
      padding-left: calc(2px * var(--ui-scale));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dropdown-content .dropdown-item.song-item .song-name::before {
      content: '🎵 ';
    }
    .dropdown-content .dropdown-item.song-item .remove-btn {
      background: none;
      border: none;
      color: #c45a4a;
      font-size: calc(0.9rem * var(--ui-scale));
      cursor: pointer;
      padding: 0 calc(4px * var(--ui-scale));
      font-weight: 600;
      opacity: 0.6;
      flex: 0 0 auto;
    }
    .dropdown-content .dropdown-item.song-item .remove-btn:hover {
      opacity: 1;
    }
    .dropdown-content .dropdown-item.folder-item {
      padding-left: calc(10px * var(--ui-scale));
      font-weight: 600;
      font-size: calc(0.85rem * var(--ui-scale));
      color: #8b6b4a;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropdown-content .dropdown-item.folder-item::before {
      content: '📁 ';
    }
    .dropdown-content .dropdown-item.folder-item .folder-arrow {
      font-size: calc(0.7rem * var(--ui-scale));
      color: #b0987a;
      margin-left: calc(8px * var(--ui-scale));
    }
    .dropdown-divider {
      border-top: 1px solid #dcc9b0;
      margin: 6px 8px;
    }
    .dropdown-label {
      padding: calc(6px * var(--ui-scale)) calc(16px * var(--ui-scale)) calc(3px * var(--ui-scale)) calc(16px * var(--ui-scale));
      font-size: calc(0.7rem * var(--ui-scale));
      font-weight: 600;
      color: #b0987a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .subfolder-popup {
      display: none;
      position: absolute;
      left: 100%;
      top: -4px;
      background-color: #f5ede0;
      min-width: calc(200px * var(--ui-scale));
      max-width: min(calc(520px * var(--ui-scale)), 80vw);
      width: max-content;
      max-height: 350px;
      overflow-y: auto;
      overflow-x: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      border-radius: 8px;
      border: 1px solid #dcc9b0;
      z-index: 200;
      padding: 6px 0;
      margin-left: 2px;
    }
    .subfolder-popup.show {
      display: block;
    }
    .subfolder-popup .dropdown-item {
      padding: calc(8px * var(--ui-scale)) calc(16px * var(--ui-scale));
      font-size: calc(0.8rem * var(--ui-scale));
      font-weight: 500;
      color: #5c4033;
      cursor: pointer;
      position: relative;
    }
    .subfolder-popup .dropdown-item:hover {
      background: #ece0cf;
    }
    .subfolder-popup .dropdown-item.song-item {
      padding-left: calc(6px * var(--ui-scale));
      padding-right: calc(12px * var(--ui-scale));
      display: flex;
      align-items: center;
      gap: calc(6px * var(--ui-scale));
    }
    .subfolder-popup .dropdown-item.song-item .song-name {
      flex: 1 1 auto;
      min-width: 0;
      padding-left: calc(2px * var(--ui-scale));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .subfolder-popup .dropdown-item.song-item .song-name::before {
      content: '🎵 ';
    }
    .subfolder-popup .dropdown-item.song-item .remove-btn {
      background: none;
      border: none;
      color: #c45a4a;
      font-size: calc(0.9rem * var(--ui-scale));
      cursor: pointer;
      padding: 0 calc(4px * var(--ui-scale));
      font-weight: 600;
      opacity: 0.6;
      flex: 0 0 auto;
    }
    .subfolder-popup .dropdown-item.song-item .remove-btn:hover {
      opacity: 1;
    }
    .subfolder-popup .dropdown-item.folder-item {
      padding-left: calc(10px * var(--ui-scale));
      font-weight: 600;
      color: #8b6b4a;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .subfolder-popup .dropdown-item.folder-item::before {
      content: '📂 ';
    }

    /* ====== TOOLBAR ZOOM (master scale) ====== */
    .toolbar-zoom {
      display: inline-flex;
      align-items: center;
      gap: calc(8px * var(--ui-scale));
      background: #dcc9b0;
      border: 1px solid #c4ad92;
      padding: calc(3px * var(--ui-scale)) calc(6px * var(--ui-scale)) calc(3px * var(--ui-scale)) calc(12px * var(--ui-scale));
      border-radius: 40px;
      font-size: calc(0.85rem * var(--ui-scale));
      color: #5c4033;
      font-weight: 500;
      white-space: nowrap;
    }
    .toolbar-zoom .toolbar-zoom-label {
      font-size: calc(0.85rem * var(--ui-scale));
    }
    .toolbar-zoom input[type="range"] {
      width: calc(110px * var(--ui-scale));
      accent-color: #8b6b4a;
      cursor: pointer;
      margin: 0;
      vertical-align: middle;
    }
    .toolbar-zoom input[type="number"] {
      width: calc(60px * var(--ui-scale));
      border: 1px solid #c4ad92;
      border-radius: 6px;
      padding: calc(3px * var(--ui-scale)) calc(6px * var(--ui-scale));
      font-size: calc(0.8rem * var(--ui-scale));
      font-family: inherit;
      color: #3d2b1f;
      background: #ffffff;
      outline: none;
      text-align: right;
      -moz-appearance: textfield;
    }
    .toolbar-zoom input[type="number"]::-webkit-outer-spin-button,
    .toolbar-zoom input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .toolbar-zoom input[type="number"]:focus {
      border-color: #8b6b4a;
      box-shadow: 0 0 0 2px rgba(139, 107, 74, 0.2);
    }
    .toolbar-zoom-reset {
      background: transparent;
      border: none;
      color: #8b6b4a;
      font-size: calc(1.05rem * var(--ui-scale));
      line-height: 1;
      padding: calc(3px * var(--ui-scale)) calc(8px * var(--ui-scale)) calc(3px * var(--ui-scale)) calc(6px * var(--ui-scale));
      margin-left: 0;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
    }
    .toolbar-zoom-reset:hover {
      background: #c4ad92;
      color: #3d2b1f;
    }
    .toolbar-zoom-reset:active {
      background: #b0987a;
    }

    .editor-wrapper {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .preview-area {
      width: 100%;
      background: #f5ede0;
      padding: 12px 20px 16px 20px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .input-area {
      width: 100%;
      padding: 8px 14px 10px 14px;
      background: #f5ede0;
      border-top: 2px solid #dcc9b0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      min-height: 60px;
      max-height: 60%;
      height: 200px;
      overflow: hidden;
      position: relative;
      transition: height 0.2s ease, padding 0.2s ease;
    }
    .input-area.collapsed {
      max-height: 0;
      padding: 0;
      border-top: none;
      min-height: 0;
      height: 0;
    }
    .resize-handle {
      position: absolute;
      top: -4px;
      left: 0;
      right: 0;
      height: 8px;
      cursor: ns-resize;
      z-index: 10;
    }
    .resize-handle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 3px;
      background: #c4ad92;
      border-radius: 2px;
      opacity: 0.5;
    }
    .resize-handle:hover::after {
      opacity: 1;
      background: #8b6b4a;
    }
    .drop-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }
    textarea {
      width: 100%;
      flex: 1;
      border: 1px solid #dcc9b0;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: calc(0.8rem * var(--editor-scale));
      line-height: 1.5;
      font-family: var(--font-chord, 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Menlo', 'Consolas', 'Roboto Mono', 'DejaVu Sans Mono', monospace);
      resize: none;
      background: #ffffff;
      color: #3d2b1f;
      outline: none;
      min-height: 50px;
    }
    textarea:focus {
      border-color: #8b6b4a;
      box-shadow: 0 0 0 3px rgba(139, 107, 74, 0.15);
    }
    .drop-zone .drop-message {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(245, 237, 224, 0.95);
      padding: 20px 30px;
      border-radius: 12px;
      border: 2px dashed #8b6b4a;
      color: #5c4033;
      font-size: 1.0rem;
      font-weight: 600;
      pointer-events: none;
      z-index: 20;
    }
    .drop-zone.drag-over .drop-message {
      display: block;
    }
    .chord-preview {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px 24px;
      flex: 1;
      min-height: 80px;
      overflow-y: auto;
      overflow-x: hidden;
      border: 1px solid #dcc9b0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);
      font-family: var(--font-chord, 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Menlo', 'Consolas', 'Roboto Mono', 'DejaVu Sans Mono', monospace);
      line-height: 1.9;
      color: #3d2b1f;
    }
    .empty-preview {
      color: #b0987a;
      font-style: italic;
      text-align: center;
      padding: 20px 0;
    }
    .empty-preview .main-text {
      font-size: 1rem;
      color: #5c4033;
    }
    .empty-preview .sub-text {
      font-size: 0.85rem;
      color: #b0987a;
    }

    /* CHORD LINE - free-flow, sized to content */
    .chord-line {
      display: block;
      width: 100%;
      padding: 2px 0;
      white-space: nowrap;
    }
    .chord-line .chord-token {
      display: inline-block;
      padding: 1px 4px;
      font-weight: 700;
      white-space: nowrap;
      font-family: var(--font-chord, 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Menlo', 'Consolas', 'Roboto Mono', 'DejaVu Sans Mono', monospace);
      font-size: 0.85rem;
      vertical-align: middle;
    }
    .chord-line .chord-token.empty {
      font-weight: 700;
    }
    .chord-line .barline {
      display: inline-block;
      width: var(--barline-width, 5px);
      height: 1em;
      background-color: #c4ad92;
      vertical-align: middle;
      margin: 0 10px 0 6px;
      position: relative;
      top: 0.05em;
    }
    .chord-line .space {
      display: inline-block;
      white-space: pre;
    }

    .lyrics-line {
      display: block;
      width: 100%;
      padding: 1px 0;
    }
    .lyrics-line .lyric-text {
      display: block;
      padding: 1px 2px;
      font-weight: 400;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
      text-align: left;
      min-height: 18px;
      color: #3d2b1f;
      font-size: var(--lyric-size, 0.85rem);
      line-height: 1.5;
      font-family: var(--font-lyric, 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Menlo', 'Consolas', 'Roboto Mono', 'DejaVu Sans Mono', monospace);
    }
    .hr-line {
      display: block;
      width: 100%;
      padding: 6px 0;
    }
    .hr-line .hr {
      display: block;
      width: 100%;
      height: 0;
      border: none;
      border-top: 2px solid #dcc9b0;
    }
    .empty-line {
      display: block;
      width: 100%;
      padding: 4px 0;
      height: 24px;
    }

    /* SECTION LABELS */
    .section-block {
      margin: 3px 0 2px 0;
      display: inline-block;
      border-radius: var(--label-radius, 4px);
      padding: 0.15em 0.75em;
      font-size: var(--label-size, 1rem);
    }
    .section-block .section {
      font-family: var(--font-chord, 'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Menlo', 'Consolas', 'Roboto Mono', 'DejaVu Sans Mono', monospace);
      color: #FFFFFF;
      display: inline-block;
    }
    .section-block .section .section-name {
      font-weight: 700;
    }
    .section-block .section .section-extra {
      font-weight: 400;
      opacity: 0.9;
    }
    .section-block.section-intro { background-color: #6a8caf; }
    .section-block.section-verse { background-color: #5a8a5a; }
    .section-block.section-pre-chorus { background-color: #d4953a; }
    .section-block.section-chorus { background-color: #c45a4a; }
    .section-block.section-post-chorus { background-color: #8b6b4a; }
    .section-block.section-bridge { background-color: #8a6a9a; }
    .section-block.section-instrumental { background-color: #5a5a5a; }
    .section-block.section-outro { background-color: #6a8caf; }
    .section-block.section-custom { background-color: #888888; }

    /* Section colors for chords */
    .chord-token.section-intro { color: #6a8caf; }
    .chord-token.section-verse { color: #5a8a5a; }
    .chord-token.section-pre-chorus { color: #d4953a; }
    .chord-token.section-chorus { color: #c45a4a; }
    .chord-token.section-post-chorus { color: #8b6b4a; }
    .chord-token.section-bridge { color: #8a6a9a; }
    .chord-token.section-instrumental { color: #5a5a5a; }
    .chord-token.section-outro { color: #6a8caf; }
    .chord-token.section-custom { color: #888888; }
    .chord-token.empty.section-intro { color: #6a8caf; }
    .chord-token.empty.section-verse { color: #5a8a5a; }
    .chord-token.empty.section-pre-chorus { color: #d4953a; }
    .chord-token.empty.section-chorus { color: #c45a4a; }
    .chord-token.empty.section-post-chorus { color: #8b6b4a; }
    .chord-token.empty.section-bridge { color: #8a6a9a; }
    .chord-token.empty.section-instrumental { color: #5a5a5a; }
    .chord-token.empty.section-outro { color: #6a8caf; }
    .chord-token.empty.section-custom { color: #888888; }

    /* Key selector */
    .key-selector {
      display: flex;
      align-items: center;
      gap: calc(6px * var(--ui-scale));
      font-size: calc(0.85rem * var(--ui-scale));
      color: #5c4033;
      font-weight: 500;
      background: #dcc9b0;
      padding: calc(3px * var(--ui-scale)) calc(10px * var(--ui-scale)) calc(3px * var(--ui-scale)) calc(12px * var(--ui-scale));
      border-radius: 40px;
      white-space: nowrap;
    }
    .key-selector select {
      background: #f5ede0;

<script>
  (function() {
    const inputEl = document.getElementById('chartInput');
    const previewContent = document.getElementById('previewContent');
    const previewContainer = document.getElementById('previewContainer');
    const inputArea = document.getElementById('inputArea');
    const previewArea = document.getElementById('previewArea');

    const settingsOverlay = document.getElementById('settingsOverlay');

    const dropdownToggle = document.getElementById('dropdownToggle');

    const songsList = document.getElementById('songsList');
    const dropZone = document.getElementById('dropZone');
    const transposeUpBtn = document.getElementById('transposeUp');
    const transposeDownBtn = document.getElementById('transposeDown');
    const transposeInfo = document.getElementById('transposeInfo');
    const keySelect = document.getElementById('keySelect');
    const keyModeSelect = document.getElementById('keyModeSelect');
    const keyDisplay = document.getElementById('keyDisplay');

    const masterScaleSlider = document.getElementById('masterScaleSlider');
    const masterScaleNum = document.getElementById('masterScaleNum');
    const masterScaleReset = document.getElementById('masterScaleReset');
    const uiScaleSlider = document.getElementById('uiScaleSlider');
    const uiScaleNum = document.getElementById('uiScaleNum');
    const editorScaleSlider = document.getElementById('editorScaleSlider');
    const editorScaleNum = document.getElementById('editorScaleNum');
    const chordFontSelect = document.getElementById('chordFontSelect');
    const chordFontCustomRow = document.getElementById('chordFontCustomRow');
    const chordFontCustom = document.getElementById('chordFontCustom');
    const chordSizeSlider = document.getElementById('chordSizeSlider');
    const chordSizeNum = document.getElementById('chordSizeNum');
    const lyricFontSelect = document.getElementById('lyricFontSelect');
    const lyricFontCustomRow = document.getElementById('lyricFontCustomRow');
    const lyricFontCustom = document.getElementById('lyricFontCustom');
    const lyricSizeSlider = document.getElementById('lyricSizeSlider');
    const lyricSizeNum = document.getElementById('lyricSizeNum');
    const labelSizeSlider = document.getElementById('labelSizeSlider');
    const labelSizeNum = document.getElementById('labelSizeNum');
    const labelRadiusSlider = document.getElementById('labelRadiusSlider');
    const labelRadiusNum = document.getElementById('labelRadiusNum');
    const barlineWidthSlider = document.getElementById('barlineWidthSlider');
    const barlineWidthNum = document.getElementById('barlineWidthNum');
    const barlineHeightSlider = document.getElementById('barlineHeightSlider');
    const barlineHeightNum = document.getElementById('barlineHeightNum');

    let currentSection = '';
    let isEditorCollapsed = false;
    let isAdvancedMode = false;
    let isResizing = false;
    let startY = 0;
    let startHeight = 0;
    let transposeSemitones = 0;
    let currentKey = 'Dm';
    let currentMode = 'minor';
    let originalText = '';

    const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    const NOTE_MAP = {
      'C': 0, 'B#': 0, 'C#': 1, 'Db': 1, 'D': 2, 'D#': 3, 'Eb': 3,
      'E': 4, 'Fb': 4, 'F': 5, 'E#': 5, 'F#': 6, 'Gb': 6, 'G': 7,
      'G#': 8, 'Ab': 8, 'A': 9, 'A#': 10, 'Bb': 10, 'B': 11, 'Cb': 11
    };

    const VALID_MAJOR_KEYS = ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'Gb', 'Db', 'Ab', 'Eb', 'Bb', 'F'];
    const VALID_MINOR_KEYS = ['Am', 'Em', 'Bm', 'F#m', 'C#m', 'G#m', 'D#m', 'Ebm', 'Bbm', 'Fm', 'Cm', 'Gm', 'Dm'];
    const VALID_ROOTS = [...VALID_MAJOR_KEYS, ...VALID_MINOR_KEYS];

    const MINOR_KEY_MAP = {
      'C': 'Am', 'G': 'Em', 'D': 'Bm', 'A': 'F#m', 'E': 'C#m', 'B': 'G#m',
      'F#': 'D#m', 'Gb': 'Ebm', 'Db': 'Bbm', 'Ab': 'Fm', 'Eb': 'Cm', 'Bb': 'Gm', 'F': 'Dm'
    };

    // ===== ZOOM: logarithmic mapping so 1.00 sits exactly at slider center =====
    const MS_MIN = 0.1;
    const MS_MAX = 10;

    function sliderPosToScale(pos) {
      const t = pos / 100;
      return MS_MIN * Math.pow(MS_MAX / MS_MIN, t);
    }

    function scaleToSliderPos(v) {
      v = Math.min(MS_MAX, Math.max(MS_MIN, v));
      const t = Math.log(v / MS_MIN) / Math.log(MS_MAX / MS_MIN);
      return Math.round(t * 1000) / 10;
    }

    // ===== SETTINGS =====
    const SETTINGS_KEY = 'chordChartSettings';
    const EDITOR_STATE_KEY = 'chordChartEditorHidden';

    const DEFAULT_SETTINGS = {
      masterScale: 1,
      uiScale: 1,
      editorScale: 1,
      chordFont: "'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Menlo', 'Consolas', 'Roboto Mono', 'DejaVu Sans Mono', monospace",
      chordFontCustom: '',
      lyricFont: "'Fira Code', 'JetBrains Mono', 'Cascadia Code', 'SF Mono', 'Menlo', 'Consolas', 'Roboto Mono', 'DejaVu Sans Mono', monospace",
      lyricFontCustom: '',
      chordSizeMult: 1,
      lyricSize: 0.85,
      labelSize: 1,
      labelRadius: 4,
      barlineWidth: 5,
      barlineHeightMult: 2
    };

    let settings = Object.assign({}, DEFAULT_SETTINGS);

    function clampNum(v, min, max) {
      if (isNaN(v)) return min;
      return Math.min(max, Math.max(min, v));
    }

    function loadSettings() {
      try {
        const stored = localStorage.getItem(SETTINGS_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          settings = Object.assign({}, DEFAULT_SETTINGS, parsed);
        }
      } catch (e) {
        console.log('Could not load settings, using defaults');
      }
    }

    function saveSettings() {
      try {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
      } catch (e) {
        console.log('Could not save settings');
      }
    }

    function loadEditorHiddenState() {
      try {
        return localStorage.getItem(EDITOR_STATE_KEY) === 'true';
      } catch (e) {
        return false;
      }
    }

    function saveEditorHiddenState(hidden) {
      try {
        localStorage.setItem(EDITOR_STATE_KEY, hidden ? 'true' : 'false');
      } catch (e) {}
    }

    function effectiveFont(baseFont, customName) {
      if (customName && customName.trim()) {
        return `'${customName.trim().replace(/'/g, "\\'")}', ${baseFont}`;
      }
      return baseFont;
    }

    function applySettings() {
      const root = document.documentElement;
      const ms = parseFloat(settings.masterScale) || 1;
      root.style.setProperty('--font-chord', effectiveFont(settings.chordFont, settings.chordFontCustom));
      root.style.setProperty('--font-lyric', effectiveFont(settings.lyricFont, settings.lyricFontCustom));
      root.style.setProperty('--chord-size-mult', settings.chordSizeMult * ms);
      root.style.setProperty('--lyric-size', (settings.lyricSize * ms) + 'rem');
      root.style.setProperty('--label-size', (settings.labelSize * ms) + 'rem');
      root.style.setProperty('--label-radius', settings.labelRadius + 'px');
      root.style.setProperty('--barline-width', (settings.barlineWidth * ms) + 'px');
      root.style.setProperty('--barline-height-mult', settings.barlineHeightMult);

    function updateKeyDisplay() {
      const majorRoot = keySelect.value;
      const minorRoot = MINOR_KEY_MAP[majorRoot] || 'Am';
      const displayKey = currentMode === 'minor' ? minorRoot : majorRoot;
      keyDisplay.textContent = `(${displayKey})`;
    }

    function getCurrentKey() {
      const majorRoot = keySelect.value;
      if (currentMode === 'minor') {
        return MINOR_KEY_MAP[majorRoot] || majorRoot;
      }
      return majorRoot;
    }

    keySelect.addEventListener('change', function() {
      currentKey = getCurrentKey();

    });

    keyModeSelect.addEventListener('change', function() {
      currentMode = this.value;

      resetTransposition();
    });

    function transposeChordWithKey(chord, semitones, key) {
      if (!chord || chord === '_' || chord === '') return chord;
      if (semitones === 0) return chord;

      const match = chord.match(/^([A-G][#b]?)(.*)$/);
      if (!match) return chord;

      const root = match[1];
      const rest = match[2] || '';

      const keyIndex = NOTE_MAP[key];
      const rootIndex = NOTE_MAP[root];

      if (keyIndex === undefined || rootIndex === undefined) return chord;

      let interval = (rootIndex - keyIndex + 12) % 12;
      let newKeyIndex = (keyIndex + semitones + 12) % 12;

      const validKeys = VALID_ROOTS.filter(r => NOTE_MAP[r] === newKeyIndex);
      if (validKeys.length === 0) return chord;

      const keyHasSharp = key.includes('#');
      const keyHasFlat = key.includes('b');

      let newKey;
      if (keyHasSharp) {
        newKey = validKeys.find(r => r.includes('#'));
      } else if (keyHasFlat) {
        newKey = validKeys.find(r => r.includes('b'));
      } else {
        newKey = validKeys.find(r => !r.includes('#') && !r.includes('b'));
      }
      newKey = newKey || validKeys[0];

      const newKeyIndexActual = NOTE_MAP[newKey];
      let newRootIndex = (newKeyIndexActual + interval) % 12;

      const validRoots = VALID_ROOTS.filter(r => NOTE_MAP[r] === newRootIndex);
      if (validRoots.length === 0) return chord;

      const originalHasSharp = root.includes('#');
      const originalHasFlat = root.includes('b');

      let newRoot;
      if (originalHasSharp) {
        newRoot = validRoots.find(r => r.includes('#'));
      } else if (originalHasFlat) {
        newRoot = validRoots.find(r => r.includes('b'));
      } else {
        newRoot = validRoots.find(r => !r.includes('#') && !r.includes('b'));
      }
      newRoot = newRoot || validRoots[0];

      return newRoot + rest;
    }

    function transposeText(text, semitones, key) {
      if (semitones === 0) return text;

      const lines = text.split('\n');
      const transposedLines = lines.map(line => {
        const tokens = line.split(/(\s+)/);
        return tokens.map(token => {
          if (token.match(/^[A-G][#b]?[A-Za-z0-9#b/]*$/)) {
            if (token.includes('/')) {
              const parts = token.split('/');
              const transposedParts = parts.map(part => transposeChordWithKey(part, semitones, key));
              return transposedParts.join('/');
            }
            return transposeChordWithKey(token, semitones, key);
          }
          return token;
        }).join('');
      });

      return transposedLines.join('\n');
    }

    function applyTransposition() {
      const key = getCurrentKey();
      if (transposeSemitones === 0) {
        inputEl.value = originalText;
      } else {
        inputEl.value = transposeText(originalText, transposeSemitones, key);
      }
      updatePreview();
      transposeInfo.textContent = transposeSemitones;
    }

    function transposeUp() {
      if (transposeSemitones >= 6) return;
      transposeSemitones++;
      applyTransposition();
    }

    function transposeDown() {
      if (transposeSemitones <= -6) return;
      transposeSemitones--;
      applyTransposition();
    }

    function resetTransposition() {
      transposeSemitones = 0;
      transposeInfo.textContent = '0';
      if (originalText) {
        inputEl.value = originalText;
        updatePreview();
      }
    }

    function loadSong(content) {
      originalText = content;
      inputEl.value = content;
      resetTransposition();
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add('drag-over');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('drag-over');
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('drag-over');

      const files = e.dataTransfer.files;
      if (files.length === 0) return;

      const txtFiles = Array.from(files).filter(file => file.name.endsWith('.txt'));

      if (txtFiles.length === 0) {
        alert('Please drop .txt files only.');
        return;
      }

      if (txtFiles.length === 1) {
        const file = txtFiles[0];
        const reader = new FileReader();
        reader.onload = function(event) {
          const content = event.target.result;
          const fileName = file.name.replace('.txt', '');
          const folder = file.webkitRelativePath ? getFolderPath(file.webkitRelativePath) : '';

          const storedSongs = loadStoredSongs() || [];
          const existingIndex = storedSongs.findIndex(s => s.name === fileName && s.folder === folder);
          if (existingIndex >= 0) {
            storedSongs[existingIndex].content = content;
          } else {
            storedSongs.push({ name: fileName, content: content, folder: folder });
          }
          saveSongsToStorage(storedSongs);

          loadSong(content);
          displayStoredSongs();
        };
        reader.readAsText(file);
        return;
      }

      const storedSongs = loadStoredSongs() || [];
      let loadedCount = 0;

      txtFiles.forEach((file) => {
        const reader = new FileReader();
        reader.onload = function(event) {
          const content = event.target.result;
          const fileName = file.name.replace('.txt', '');
          const folder = file.webkitRelativePath ? getFolderPath(file.webkitRelativePath) : '';

          const existingIndex = storedSongs.findIndex(s => s.name === fileName && s.folder === folder);
          if (existingIndex >= 0) {
            storedSongs[existingIndex].content = content;
          } else {
            storedSongs.push({ name: fileName, content: content, folder: folder });
          }

          loadedCount++;
          if (loadedCount === txtFiles.length) {
            saveSongsToStorage(storedSongs);
            displayStoredSongs();
            const firstFile = txtFiles[0];
            const firstReader = new FileReader();
            firstReader.onload = function(e) {
              loadSong(e.target.result);
            };
            firstReader.readAsText(firstFile);
          }
        };
        reader.readAsText(file);
      });
    }

    document.addEventListener('dragover', function(e) { e.preventDefault(); });
    document.addEventListener('drop', function(e) { e.preventDefault(); });

    dropZone.addEventListener('dragover', handleDragOver);
    dropZone.addEventListener('dragleave', handleDragLeave);
    dropZone.addEventListener('drop', handleDrop);

    function loadStoredSongs() {
      try {
        const stored = localStorage.getItem('chordChartSongs');
        if (stored) return JSON.parse(stored);
      } catch (e) { console.log('Could not load stored songs'); }
      return null;
    }

    function saveSongsToStorage(songs) {
      try {
        localStorage.setItem('chordChartSongs', JSON.stringify(songs));
      } catch (e) { console.log('Could not save songs'); }
    }

    function clearStoredSongs() {
      if (confirm('Clear all saved songs from memory? (This will not delete your files)')) {
        localStorage.removeItem('chordChartSongs');
        displayStoredSongs();
      }
    }

    function removeSong(songName, songFolder) {
      const storedSongs = loadStoredSongs() || [];
      const index = storedSongs.findIndex(s => s.name === songName && s.folder === (songFolder || ''));
      if (index >= 0) {
        if (confirm(`Are you sure you want to remove "${songName}"?`)) {
          storedSongs.splice(index, 1);
          saveSongsToStorage(storedSongs);
          displayStoredSongs();
        }
      }
    }

    function getFolderPath(filePath) {
      const parts = filePath.split(/[\/\\]/);
      parts.pop();
      return parts.join('/');
    }

    function displayStoredSongs() {
      const storedSongs = loadStoredSongs();
      songsList.innerHTML = '';

      if (storedSongs && storedSongs.length > 0) {
        const tree = {};

        storedSongs.forEach(song => {
          const folder = song.folder || '';
          if (folder === '') {
            if (!tree._root) tree._root = [];
            tree._root.push(song);
          } else {
            const parts = folder.split('/').filter(p => p !== '');
            let current = tree;
            for (let part of parts) {
              if (!current[part]) current[part] = {};
              current = current[part];
            }
            if (!current._songs) current._songs = [];
            current._songs.push(song);
          }
        });

        const folderNames = Object.keys(tree).filter(k => k !== '_root');
        folderNames.sort((a, b) => a.localeCompare(b, 'th', { sensitivity: 'base' }));

        folderNames.forEach(folderName => {
          const folderItem = document.createElement('div');
          folderItem.className = 'dropdown-item folder-item';
          folderItem.textContent = folderName;

          const arrow = document.createElement('span');
          arrow.className = 'folder-arrow';
          arrow.textContent = '▶';
          folderItem.appendChild(arrow);

          const popup = document.createElement('div');
          popup.className = 'subfolder-popup';

          const subTree = tree[folderName];
          if (subTree._songs) {
            subTree._songs.sort((a, b) => a.name.localeCompare(b.name, 'th', { sensitivity: 'base' }));
            subTree._songs.forEach(song => {
              popup.appendChild(createSongItem(song));
            });
          }

          const subFolderNames = Object.keys(subTree).filter(k => k !== '_songs');
          subFolderNames.sort((a, b) => a.localeCompare(b.name, 'th', { sensitivity: 'base' }));

          subFolderNames.forEach(subFolderName => {
            const subFolderTree = subTree[subFolderName];
            const subFolderItem = document.createElement('div');
            subFolderItem.className = 'dropdown-item folder-item';
            subFolderItem.textContent = subFolderName;
            const subArrow = document.createElement('span');
            subArrow.className = 'folder-arrow';
            subArrow.textContent = '▶';
            subFolderItem.appendChild(subArrow);

            const subPopup = document.createElement('div');
            subPopup.className = 'subfolder-popup';

            if (subFolderTree._songs) {
              subFolderTree._songs.sort((a, b) => a.name.localeCompare(b.name, 'th', { sensitivity: 'base' }));
              subFolderTree._songs.forEach(song => {
                subPopup.appendChild(createSongItem(song));
              });
            }

            subFolderItem.appendChild(subPopup);
            subFolderItem.addEventListener('mouseenter', function() {
              document.querySelectorAll('.subfolder-popup.show').forEach(p => {
                if (p !== subPopup) p.classList.remove('show');
              });
              subPopup.style.top = '0px';
              subPopup.style.left = '100%';
              subPopup.classList.add('show');
            });
            subFolderItem.addEventListener('mouseleave', function() {
              setTimeout(() => {
                if (!subPopup.matches(':hover') && !subFolderItem.matches(':hover')) {
                  subPopup.classList.remove('show');
                }
              }, 300);
            });
            subPopup.addEventListener('mouseenter', function() { subPopup.classList.add('show'); });
            subPopup.addEventListener('mouseleave', function() {
              setTimeout(() => {
                if (!subFolderItem.matches(':hover')) subPopup.classList.remove('show');
              }, 300);
            });

            popup.appendChild(subFolderItem);
          });

          folderItem.appendChild(popup);

          folderItem.addEventListener('mouseenter', function() {
            document.querySelectorAll('.subfolder-popup.show').forEach(p => {
              if (p !== popup) p.classList.remove('show');
            });
            popup.style.top = '0px';
            popup.style.left = '100%';
            popup.classList.add('show');
          });
          folderItem.addEventListener('mouseleave', function() {
            setTimeout(() => {
              if (!popup.matches(':hover') && !folderItem.matches(':hover')) {
                popup.classList.remove('show');
              }
            }, 300);
          });
          popup.addEventListener('mouseenter', function() { popup.classList.add('show'); });
          popup.addEventListener('mouseleave', function() {
            setTimeout(() => {
              if (!folderItem.matches(':hover')) popup.classList.remove('show');
            }, 300);
          });

          songsList.appendChild(folderItem);
        });

        if (tree._root) {
          tree._root.sort((a, b) => a.name.localeCompare(b.name, 'th', { sensitivity: 'base' }));
          tree._root.forEach(song => {
            songsList.appendChild(createSongItem(song));
          });
        }
      } else {
        const emptyMsg = document.createElement('div');
        emptyMsg.className = 'dropdown-item';
        emptyMsg.style.cssText = 'color: #b0987a; font-size: 0.8rem; padding: 6px 16px; font-style: italic;';
        emptyMsg.textContent = 'No songs loaded';
        songsList.appendChild(emptyMsg);
      }
    }

    function createSongItem(song) {
      const songItem = document.createElement('div');
      songItem.className = 'dropdown-item song-item';

      const nameSpan = document.createElement('span');
      nameSpan.className = 'song-name';
      nameSpan.textContent = song.name;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '✕';
      removeBtn.title = 'Remove this song';
      removeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        removeSong(song.name, song.folder || '');
      });

      nameSpan.addEventListener('click', function(e) {
        e.stopPropagation();
        loadSong(song.content);
        dropdownContent.classList.remove('show');
        document.querySelectorAll('.dropdown-item.song-item').forEach(el => el.classList.remove('active'));
        songItem.classList.add('active');
      });

      songItem.appendChild(removeBtn);
      songItem.appendChild(nameSpan);
      return songItem;
    }

        const file = e.target.files[0];

        reader.onload = function(event) {
          const content = event.target.result;
          const fileName = file.name.replace('.txt', '');
          const folder = file.webkitRelativePath ? getFolderPath(file.webkitRelativePath) : '';
          const storedSongs = loadStoredSongs() || [];
          const existingIndex = storedSongs.findIndex(s => s.name === fileName && s.folder === folder);
          if (existingIndex >= 0) storedSongs[existingIndex].content = content;
          else storedSongs.push({ name: fileName, content: content, folder: folder });
          saveSongsToStorage(storedSongs);
          loadSong(content);
          dropdownContent.classList.remove('show');
          displayStoredSongs();
        };
        reader.readAsText(file);
      };
      fileInput.click();
    });

    document.getElementById('selectFolder').addEventListener('click', function(e) {
      e.stopPropagation();
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = '.txt';
      fileInput.webkitdirectory = true;
      fileInput.multiple = true;

      fileInput.onchange = function(e) {
        const files = e.target.files;
        const songFiles = [];
        const storedSongs = loadStoredSongs() || [];

        for (let file of files) {
          if (file.name.endsWith('.txt')) {
            const fileName = file.name.replace('.txt', '');
            const fullPath = file.webkitRelativePath || file.name;
            const parts = fullPath.split(/[\/\\]/);
            parts.pop();
            const folder = parts.join('/');
            songFiles.push({ name: fileName, file: file, folder: folder });
          }
        }

        if (songFiles.length === 0) {
          alert('No .txt files found in the selected folder.');
          return;
        }

        songFiles.sort((a, b) => a.name.localeCompare(b.name, 'th', { sensitivity: 'base' }));

        let loadedCount = 0;
        songFiles.forEach((song) => {
          const reader = new FileReader();
          reader.onload = function(event) {
            const content = event.target.result;
            const existingIndex = storedSongs.findIndex(s => s.name === song.name && s.folder === song.folder);
            if (existingIndex >= 0) storedSongs[existingIndex].content = content;
            else storedSongs.push({ name: song.name, content: content, folder: song.folder });
            loadedCount++;
            if (loadedCount === songFiles.length) {
              saveSongsToStorage(storedSongs);
              displayStoredSongs();
              const firstFile = songFiles[0].file;
              const firstReader = new FileReader();
              firstReader.onload = function(e) {
                loadSong(e.target.result);
              };
              firstReader.readAsText(firstFile);
            }
          };
          reader.readAsText(song.file);
        });
      };
      fileInput.click();
    });

    resizeHandle.addEventListener('mousedown', function(e) {
      isResizing = true;
      startY = e.clientY;
      startHeight = inputArea.offsetHeight;
      document.body.style.cursor = 'ns-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!isResizing) return;
      const deltaY = startY - e.clientY;
      let newHeight = startHeight + deltaY;
      newHeight = Math.max(60, Math.min(window.innerHeight * 0.7, newHeight));
      inputArea.style.height = newHeight + 'px';
      inputArea.style.maxHeight = newHeight + 'px';
      clearTimeout(window._resizeTimeout);
      window._resizeTimeout = setTimeout(adjustChordSizes, 100);
    });
    document.addEventListener('mouseup', function() {
      if (isResizing) {
        isResizing = false;
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        setTimeout(adjustChordSizes, 150);
      }
    });

    // ===== EDITOR SHOW/HIDE (advanced mode) =====
    function applyEditorState(hidden) {
      isEditorCollapsed = hidden;
      inputArea.classList.toggle('collapsed', hidden);
      toggleBtn.textContent = hidden ? '▼ Show Editor' : '▲ Hide Editor';
      toggleBtn.classList.toggle('active', hidden);
      setTimeout(adjustChordSizes, 350);
    }

    toggleBtn.addEventListener('click', function() {
      const newHidden = !isEditorCollapsed;
      applyEditorState(newHidden);
      saveEditorHiddenState(newHidden);
    });

    // ===== MODE SWITCH =====
    function applyMode(advanced) {
      isAdvancedMode = advanced;
      if (advanced) {
        document.body.classList.remove('easy-mode');
        toggleModeBtn.textContent = '😃 Switch to EASY MODE';
        const savedHidden = loadEditorHiddenState();
        applyEditorState(savedHidden);
      } else {
        document.body.classList.add('easy-mode');
        toggleModeBtn.textContent = '😵 Switch to ADVANCED MODE';
        isEditorCollapsed = true;
      }
      setTimeout(adjustChordSizes, 250);
    }

    toggleModeBtn.addEventListener('click', function() {
      applyMode(!isAdvancedMode);
    });

    // ===== END MODE SWITCH =====

    function expandSectionShortcut(name) {
      const trimmed = name.trim();
      const lower = trimmed.toLowerCase();

      const numberMap = {
        '21': 'Verse 1','22': 'Verse 2','23': 'Verse 3','24': 'Verse 4','25': 'Verse 5',
        '26': 'Verse 6','27': 'Verse 7','28': 'Verse 8','29': 'Verse 9',
        '31': 'Pre-Chorus 1','32': 'Pre-Chorus 2','33': 'Pre-Chorus 3','34': 'Pre-Chorus 4','35': 'Pre-Chorus 5',
        '36': 'Pre-Chorus 6','37': 'Pre-Chorus 7','38': 'Pre-Chorus 8','39': 'Pre-Chorus 9',
        '41': 'Chorus 1','42': 'Chorus 2','43': 'Chorus 3','44': 'Chorus 4','45': 'Chorus 5',
        '46': 'Chorus 6','47': 'Chorus 7','48': 'Chorus 8','49': 'Chorus 9',
        '51': 'Post-Chorus 1','52': 'Post-Chorus 2','53': 'Post-Chorus 3','54': 'Post-Chorus 4','55': 'Post-Chorus 5',
        '56': 'Post-Chorus 6','57': 'Post-Chorus 7','58': 'Post-Chorus 8','59': 'Post-Chorus 9',
        '61': 'Instrumental 1','62': 'Instrumental 2','63': 'Instrumental 3','64': 'Instrumental 4','65': 'Instrumental 5',
        '66': 'Instrumental 6','67': 'Instrumental 7','68': 'Instrumental 8','69': 'Instrumental 9',
        '71': 'Bridge 1','72': 'Bridge 2','73': 'Bridge 3','74': 'Bridge 4','75': 'Bridge 5',
        '76': 'Bridge 6','77': 'Bridge 7','78': 'Bridge 8','79': 'Bridge 9'
      };

      const singleNumberMap = {
        '1': 'Intro','2': 'Verse','3': 'Pre-Chorus','4': 'Chorus',
        '5': 'Post-Chorus','6': 'Instrumental','7': 'Bridge','8': 'Outro'
      };

      const textShortcuts = {
        'int': 'Intro','i': 'Intro','v': 'Verse','ver': 'Verse','pr': 'Pre-Chorus','pre': 'Pre-Chorus',
        'ch': 'Chorus','cho': 'Chorus','po': 'Post-Chorus','post': 'Post-Chorus','b': 'Bridge','bri': 'Bridge',
        'ins': 'Instrumental','inst': 'Instrumental','out': 'Outro','o': 'Outro','tag': 'Tag','t': 'Tag',
        'end': 'Ending','ending': 'Ending'
      };

      if (lower.match(/^[2-7][1-9]$/)) return numberMap[lower] || name;
      if (lower.match(/^[1-8]$/)) return singleNumberMap[lower] || name;
      const match = lower.match(/^(int|i|v|ver|pr|pre|ch|cho|po|post|b|bri|ins|inst|out|o|tag|t|end|ending)(?:\s*(\d+))?$/);
      if (match) {
        const shortcut = match[1];
        const number = match[2] || '';
        let fullName = textShortcuts[shortcut] || shortcut;
        fullName = fullName.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        return number ? `${fullName} ${number}` : fullName;
      }
      const fullMatch = lower.match(/^(intro|verse|pre-chorus|chorus|post-chorus|bridge|instrumental|outro|tag|ending)(?:\s*(\d+))?$/);
      if (fullMatch) {
        const fullName = fullMatch[1];
        const number = fullMatch[2] || '';
        const capitalized = fullName.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        const finalName = capitalized.replace(/Pre-Chorus/, 'Pre-Chorus').replace(/Post-Chorus/, 'Post-Chorus');
        return number ? `${finalName} ${number}` : finalName;
      }
      return name;
    }

    function getSectionClass(sectionName) {
      const name = sectionName.toLowerCase().trim();
      if (name.includes('intro')) return 'section-intro';
      if (name.includes('verse')) return 'section-verse';
      if (name.includes('pre-chorus')) return 'section-pre-chorus';
      if (name.includes('post-chorus')) return 'section-post-chorus';
      if (name.includes('chorus')) return 'section-chorus';
      if (name.includes('bridge')) return 'section-bridge';
      if (name.includes('instrumental')) return 'section-instrumental';
      if (name.includes('outro')) return 'section-outro';
      return '';
    }

    function normalizeChord(chord) {
      if (!chord || chord === '_' || chord === '') return chord;
      const match = chord.match(/^([a-gA-G])([#b]?)(.*)$/);
      if (match) {
        const root = match[1].toUpperCase();
        const accidental = match[2];
        const rest = match[3];
        return root + accidental + rest;
      }
      return chord;
    }

    function simplifyChord(chord) {
      if (!chord || chord === '_' || chord === '') return chord;
      let simplified = normalizeChord(chord);
      if (simplified.match(/[A-G][#b]?d\b/i) || simplified.match(/[A-G][#b]?dim\b/i) || simplified.includes('°')) {
        simplified = simplified.replace(/d|dim|°/gi, '°');
        return simplified.trim();
      }
      if (simplified.match(/[A-G][#b]?h\b/i) || simplified.toLowerCase().includes('halfdim') || simplified.toLowerCase().includes('half-dim') || simplified.toLowerCase().includes('half diminished') || simplified.includes('ø')) {
        return simplified.replace(/h|halfdim|half-dim|half diminished|half-diminished|ø/gi, 'ø').trim();
      }
      if (simplified.match(/[A-G][#b]?M7?\b/)) {
        simplified = simplified.replace(/M7?/g, 'Δ');
        return simplified.trim();
      }
      if (simplified.match(/[A-G][#b]?Maj7\b/i) || simplified.match(/[A-G][#b]?maj7\b/i) || simplified.includes('Δ')) {
        simplified = simplified.replace(/Maj7|maj7|Δ7|Δ/gi, 'Δ');
        return simplified.trim();
      }
      return simplified;
    }

    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');

    function getChordFontStackForMeasure() {
      return effectiveFont(settings.chordFont, settings.chordFontCustom);
    }

    function adjustChordSizes() {
      const content = previewContent;
      if (!content) return;

      const chordLines = content.querySelectorAll('.chord-line');
      if (chordLines.length === 0) return;

      const previewWidth = previewContent.clientWidth || 0;
      if (previewWidth < 50) return;

      const maxSize = isEditorCollapsed ? 2.5 : 1.8;

      let globalMaxText = '';
      chordLines.forEach(row => {
        const toks = row.querySelectorAll('.chord-token');
        toks.forEach(t => {
          const text = t.textContent || '';
          if (text.length > globalMaxText.length) globalMaxText = text;
        });
      });
      if (!globalMaxText) globalMaxText = 'X';

      const chordFontStack = getChordFontStackForMeasure();

      const testSpan = document.createElement('span');
      testSpan.style.cssText = `position:absolute; visibility:hidden; white-space:nowrap; font-family: ${chordFontStack}; font-weight: 700;`;
      testSpan.textContent = globalMaxText;
      document.body.appendChild(testSpan);

      let low = 0.3;
      let high = maxSize * 2;
      let bestSize = maxSize * 0.5;
      const iterations = 30;
      const targetTokenWidth = Math.max(40, previewWidth * 0.20);

      for (let i = 0; i < iterations; i++) {
        const mid = (low + high) / 2;
        testSpan.style.fontSize = mid + 'rem';
        const w = testSpan.offsetWidth;
        if (w <= targetTokenWidth) {
          bestSize = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      document.body.removeChild(testSpan);

      const mult = parseFloat(settings.chordSizeMult) || 1;
      const ms = parseFloat(settings.masterScale) || 1;
      const finalSize = bestSize * mult * ms;

      chordLines.forEach(row => {
        row.querySelectorAll('.chord-token').forEach(t => {
          t.style.fontSize = Math.round(finalSize * 100) / 100 + 'rem';
        });
      });

      const remInPx = parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
      const pxSize = finalSize * remInPx;
      measureCtx.font = `700 ${pxSize}px ${chordFontStack}`;

      const metrics = measureCtx.measureText('C#m7');
      const ascent = metrics.actualBoundingBoxAscent || (pxSize * 0.72);
      const descent = metrics.actualBoundingBoxDescent || 0;
      const glyphHeight = ascent + descent;

      const heightMult = parseFloat(settings.barlineHeightMult) || 2;
      const barlineHeight = glyphHeight * heightMult;

      content.querySelectorAll('.barline').forEach(b => {
        b.style.height = barlineHeight + 'px';
      });
    }

    function renderChordLine(line, sectionClass) {
      let html = `<div class="chord-line">`;

      const tokens = line.match(/(\s+|\S+)/g) || [];

      for (const token of tokens) {
        if (/^\s+$/.test(token)) {
          html += `<span class="space">${token.replace(/ /g, ' ')}</span>`;
          continue;
        }

        if (/^\|+$/.test(token)) {
          for (let i = 0; i < token.length; i++) {
            html += `<span class="barline"></span>`;
          }
          continue;
        }

        const simplified = simplifyChord(token);
        const isUnderscore = simplified === '_' || simplified === '';
        const displayText = isUnderscore ? '_' : simplified;
        let classes = 'chord-token';
        if (isUnderscore) classes += ' empty';
        if (sectionClass) classes += ` ${sectionClass}`;
        html += `<span class="${classes}">${displayText}</span>`;
      }

      html += `</div>`;
      return html;
    }

    function renderPreview(text) {
      if (!text || text.trim() === '') {
        previewContent.innerHTML = `
          <div class="empty-preview">
            <div class="main-text">Type or Paste your chord chart (in the editor area below)</div>
            <div class="sub-text">or Drag &amp; Drop a TXT file with a chord chart (into the editor area below)</div>
          </div>
        `;
        return;
      }
      let html = '';
      const lines = text.split('\n');
      currentSection = '';

      for (let line of lines) {
        const trimmed = line.trim();
        if (trimmed === '---' || trimmed === '___' || trimmed === '***') {
          html += `<div class="hr-line"><span class="hr"></span></div>`;
          continue;
        }
        if (trimmed === '') {
          html += `<div class="empty-line"></div>`;
          continue;
        }
        const customLabelMatch = trimmed.match(/^\[(.*?)\]$/);
        if (customLabelMatch) {
          const labelText = customLabelMatch[1].trim();
          html += `<div class="section-block section-custom"><span class="section"><span class="section-name">${labelText}</span></span></div>`;
          currentSection = 'custom';
          continue;
        }

        const sectionNameMatch = trimmed.match(/^(Intro|Verse|Pre-Chorus|Chorus|Post-Chorus|Bridge|Outro|Instrumental|Tag|Ending|Coda)/i);
        if (sectionNameMatch) {
          const sectionName = sectionNameMatch[1].trim();
          const rest = trimmed.substring(sectionName.length).trim();
          const restWordCount = rest ? rest.split(/\s+/).filter(w => w).length : 0;

          let isLabel = false;
          if (!rest) {
            isLabel = true;
          } else if (rest.match(/^\d+\s*$/)) {
            isLabel = true;
          } else if (rest.match(/^[\(\[].*[\)\]]\s*$/)) {
            isLabel = true;
          } else if (rest.match(/^\d+\s*[\(\[].*[\)\]]\s*$/)) {
            isLabel = true;
          } else if (restWordCount <= 3 && !rest.match(/[.!?,;:]/)) {
            isLabel = true;
          }

          if (isLabel) {
            let displayName = sectionName.charAt(0).toUpperCase() + sectionName.slice(1);
            currentSection = displayName;
            const sectionClass = getSectionClass(displayName);

            if (!rest) {
              html += `<div class="section-block ${sectionClass}"><span class="section"><span class="section-name">${displayName}</span></span></div>`;
            } else {
              const numberMatch = rest.match(/^(\d+)\s*(.*)$/);
              let boldPart = displayName;
              let thinPart = rest;
              if (numberMatch) {
                const number = numberMatch[1];
                const restAfterNumber = numberMatch[2] ? numberMatch[2].trim() : '';
                boldPart = displayName + ' ' + number;
                thinPart = restAfterNumber;
              }
              let fullLabel = `<span class="section-name">${boldPart}</span>`;
              if (thinPart) {
                fullLabel += ` <span class="section-extra">${thinPart}</span>`;
              }
              html += `<div class="section-block ${sectionClass}"><span class="section">${fullLabel}</span></div>`;
            }
            continue;
          }
        }

        const numberShortcutMatch = trimmed.match(/^\s*([2-7][1-9]|[1-8])\s*(.*)$/i);
        if (numberShortcutMatch) {
          const shortcut = numberShortcutMatch[1].trim();
          let extraText = numberShortcutMatch[2] ? numberShortcutMatch[2].trim() : '';
          const expandedName = expandSectionShortcut(shortcut);
          currentSection = expandedName;
          const sectionClass = getSectionClass(expandedName);

          const numberMatch = extraText.match(/^(\d+)\s*(.*)$/);
          let boldPart = expandedName;
          let thinPart = extraText;
          if (numberMatch) {
            const number = numberMatch[1];
            const restAfterNumber = numberMatch[2] ? numberMatch[2].trim() : '';
            boldPart = expandedName + ' ' + number;
            thinPart = restAfterNumber;
          }

          let fullLabel = `<span class="section-name">${boldPart}</span>`;
          if (thinPart) {
            fullLabel += ` <span class="section-extra">${thinPart}</span>`;
          }
          html += `<div class="section-block ${sectionClass}"><span class="section">${fullLabel}</span></div>`;
          continue;
        }

        if (line.includes('|')) {
          let sectionClass = getSectionClass(currentSection);
          if (currentSection === 'custom' || currentSection.toLowerCase().includes('custom')) {
            sectionClass = 'section-custom';
          }
          html += renderChordLine(line, sectionClass);
        } else {
          html += `<div class="lyrics-line"><span class="lyric-text">${trimmed}</span></div>`;
        }
      }
      previewContent.innerHTML = html;
      requestAnimationFrame(() => {
        setTimeout(adjustChordSizes, 50);
      });
    }

    function updatePreview() {
      renderPreview(inputEl.value);
    }

    document.getElementById('saveTXT').addEventListener('click', function() {
      const content = inputEl.value;
      if (!content || content.trim() === '') {
        alert('Nothing to save. The editor is empty.');
        return;
      }
      const songName = document.querySelector('.dropdown-item.active .song-name')?.textContent || 'chord-chart';
      const sanitizedName = songName.replace(/[<>:"/\\|?*\x00-\x1f]/g, '').trim() || 'chord-chart';
      const timestamp = new Date().toISOString().slice(0,10);
      const fileName = `${sanitizedName}_${timestamp}.txt`;
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = fileName;
      link.href = url;
      link.click();
      URL.revokeObjectURL(url);
      this.textContent = '✅ Saved!';
      setTimeout(() => { this.textContent = "💾 Save Editor's text as TXT"; }, 2000);
    });

    document.getElementById('exportPNG').addEventListener('click', async function() {
      const preview = document.getElementById('previewContainer');
      const contentWrapper = document.getElementById('previewContent');
      const songName = document.querySelector('.dropdown-item.active .song-name')?.textContent || 'chord-chart';
      this.textContent = '⏳ Exporting...';
      this.disabled = true;

      try {
        const originalHeight = preview.style.height;
        const originalMaxHeight = preview.style.maxHeight;
        const originalOverflow = preview.style.overflow;
        const originalPadding = preview.style.padding;
        const originalBorder = preview.style.border;
        const originalBorderRadius = preview.style.borderRadius;
        const originalBoxShadow = preview.style.boxShadow;
        const originalBackground = preview.style.background;

        preview.style.height = 'auto';
        preview.style.maxHeight = 'none';
        preview.style.overflow = 'visible';
        preview.style.padding = '40px';
        preview.style.border = 'none';
        preview.style.borderRadius = '0';
        preview.style.boxShadow = 'none';
        preview.style.background = '#ffffff';
        preview.offsetHeight;

        const fullWidth = contentWrapper.scrollWidth || preview.scrollWidth;
        const fullHeight = contentWrapper.scrollHeight || preview.scrollHeight;
        const padding = 40;
        const totalWidth = fullWidth + (padding * 2);
        const totalHeight = fullHeight + (padding * 2);

        preview.style.width = totalWidth + 'px';
        preview.style.height = totalHeight + 'px';

        const canvas = await html2canvas(preview, {
          scale: 2,
          backgroundColor: '#ffffff',
          useCORS: true,
          logging: false,
          width: totalWidth,
          height: totalHeight,
          allowTaint: false,
          foreignObjectRendering: false,
          onclone: function(doc) {
            const container = doc.getElementById('previewContainer');
            if (container) {
              container.style.padding = '40px';
              container.style.background = '#ffffff';
              container.style.border = 'none';
              container.style.borderRadius = '0';
              container.style.boxShadow = 'none';
              container.style.height = 'auto';
              container.style.maxHeight = 'none';
              container.style.overflow = 'visible';
              container.style.width = totalWidth + 'px';
            }
          }
        });

        preview.style.height = originalHeight || '';
        preview.style.maxHeight = originalMaxHeight || '';
        preview.style.overflow = originalOverflow || '';
        preview.style.padding = originalPadding || '';
        preview.style.border = originalBorder || '';
        preview.style.borderRadius = originalBorderRadius || '';
        preview.style.boxShadow = originalBoxShadow || '';
        preview.style.background = originalBackground || '';
        preview.style.width = '';

        const link = document.createElement('a');
        const sanitizedName = songName.replace(/[<>:"/\\|?*\x00-\x1f]/g, '').trim() || 'chord-chart';
        const timestamp = new Date().toISOString().slice(0,19).replace(/[:-]/g, '');
        const fileName = `${sanitizedName}_${timestamp}.png`;
        link.download = fileName;
        link.href = canvas.toDataURL('image/png');
        link.click();

        this.textContent = '✅ Exported!';
        setTimeout(() => {
          this.textContent = '📷 Save Chord Chart as PNG';
          this.disabled = false;
        }, 2000);
      } catch (err) {
        console.error('Export failed:', err);
        preview.style.height = '';
        preview.style.maxHeight = '';
        preview.style.overflow = '';
        preview.style.padding = '';
        preview.style.border = '';
        preview.style.borderRadius = '';
        preview.style.boxShadow = '';
        preview.style.background = '';
        preview.style.width = '';
        this.textContent = '❌ Export failed';
        setTimeout(() => {
          this.textContent = '📷 Save Chord Chart as PNG';
          this.disabled = false;
        }, 2000);
      }
    });

    transposeUpBtn.addEventListener('click', transposeUp);
    transposeDownBtn.addEventListener('click', transposeDown);

    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && (e.key === 'ArrowUp' || e.key === '=' || e.key === '+')) {
        e.preventDefault();
        transposeUp();
      }
      if (e.ctrlKey && e.shiftKey && (e.key === 'ArrowDown' || e.key === '-')) {
        e.preventDefault();
        transposeDown();
      }
      if (e.key === 'Escape' && settingsOverlay.classList.contains('show')) {
        closeSettings();
      }
    });

    // ===== INIT =====
    loadSettings();
    syncSettingsUI();
    applySettings();

    // Always start in Easy Mode on page load
    applyMode(false);

    displayStoredSongs();
    originalText = inputEl.value;
    currentKey = getCurrentKey();
    updateKeyDisplay();
    resetTransposition();

    inputEl.addEventListener('input', function() {
      originalText = inputEl.value;
      transposeSemitones = 0;
      transposeInfo.textContent = '0';
      updatePreview();
    });

    updatePreview();
    window.addEventListener('load', function() {
      setTimeout(adjustChordSizes, 100);
    });

    let resizeTimeout;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(adjustChordSizes, 100);
    });
  })();
</script>
