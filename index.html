    .dropdown-divider {

    }
    .subfolder-popup .dropdown-item.song-item .remove-btn:hover {

    }
    .subfolder-popup .dropdown-item.folder-item {
      padding-left: 8px;
      font-weight: 600;
      color: #8b6b4a;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .subfolder-popup .dropdown-item.folder-item::before {
      content: '📂 ';

    .subfolder-popup .dropdown-item.folder-item .folder-arrow {
      font-size: 0.5rem;
      color: #b0987a;

    .subfolder-popup::-webkit-scrollbar {

    }
    .subfolder-popup::-webkit-scrollbar-thumb {

    }
    .subfolder-popup::-webkit-scrollbar-thumb:hover {

    .drop-zone {
      position: relative;
    }
    .drop-zone.drag-over textarea {
      border-color: #8b6b4a;
      background-color: #f8f0e8;
      box-shadow: 0 0 0 3px rgba(139, 107, 74, 0.2);
    }
    .drop-zone .drop-message {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(245, 237, 224, 0.95);
      padding: 20px 30px;
      border-radius: 12px;
      border: 2px dashed #8b6b4a;
      color: #5c4033;
      font-size: 0.9rem;
      font-weight: 600;
      pointer-events: none;
      z-index: 20;
      text-align: center;
    }
    .drop-zone.drag-over .drop-message {
      display: block;
    }
    .editor-wrapper {
      display: flex;
      flex-direction: column;
      gap: 0;
      flex: 1;
      min-height: 0;
      height: 100%;
      transition: all 0.3s ease;
    }
    .preview-area {
      width: 100%;
      background: #f5ede0;
      padding: 8px 16px 12px 16px;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
    }
    .preview-area.expanded {
      height: 100%;
    }
    .input-area {
      width: 100%;
      padding: 8px 14px 10px 14px;
      background: #f5ede0;
      border-top: 2px solid #dcc9b0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      min-height: 60px;
      max-height: 60%;
      height: 200px;
      transition: all 0.3s ease;
      overflow: hidden;
      position: relative;
    }
    .input-area.collapsed {
      max-height: 0;
      padding: 0;
      border-top: none;
      min-height: 0;
      height: 0;
    }
    .resize-handle {
      position: absolute;
      top: -4px;
      left: 0;
      right: 0;
      height: 8px;
      cursor: ns-resize;
      z-index: 10;
      background: transparent;
      transition: background 0.15s ease;
    }
    .resize-handle:hover {
      background: rgba(92, 64, 51, 0.1);
    }
    .resize-handle::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 3px;
      background: #c4ad92;
      border-radius: 2px;
      opacity: 0.5;
      transition: opacity 0.15s ease;
    }
    .resize-handle:hover::after {
      opacity: 1;
      background: #8b6b4a;
    }
    .drop-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      position: relative;
    }
    textarea {
      width: 100%;
      flex: 1;
      border: 1px solid #dcc9b0;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.7rem;
      line-height: 1.5;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      resize: none;
      background: #ffffff;
      color: #3d2b1f;
      transition: border 0.1s, background-color 0.2s;
      tab-size: 2;
      outline: none;
      min-height: 50px;
    }
    textarea:focus {
      border-color: #8b6b4a;
      box-shadow: 0 0 0 3px rgba(139, 107, 74, 0.15);
    }
    .drop-zone .drop-message {
      display: none;

      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(245, 237, 224, 0.95);

    .drop-zone.drag-over .drop-message {

    .drop-zone.drag-over textarea {

    .chord-preview {
      background: #ffffff;
      border-radius: 12px;
      padding: 10px 16px;
      flex: 1;
      min-height: 80px;
      overflow-y: auto;
      overflow-x: hidden;
      border: 1px solid #dcc9b0;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.04);

      line-height: 1.9;

    .chord-preview .content-wrapper {

    .empty-preview .main-text {

    }

    }
    @media (max-width: 720px) {
      .input-area {
        max-height: 50%;
        height: 160px;
      }
      textarea {
        min-height: 40px;
        font-size: 0.65rem;
      }
      .chord-preview {

      .toolbar h1 {

      .empty-preview .main-text {

      .empty-preview .sub-text {

    .chord-line {
      display: flex;
      flex-wrap: nowrap;
      width: 100%;
      gap: 0;
    }
    .chord-line .bar {
      display: flex;
      flex-wrap: nowrap;
      flex: 1 1 0;
      min-width: 0;
      padding-right: 6px;
      position: relative;
    }
    .chord-line .bar.empty-bar {
      visibility: hidden;
    }
    .chord-line .bar.empty-bar .bar-inner {
      visibility: hidden;
    }
    .chord-line .bar.empty-bar::after {
      display: none;
    }
    .chord-line .bar .bar-inner {
      display: flex;
      flex-wrap: nowrap;
      width: 100%;
      padding-right: 4px;
      gap: 2px;
      justify-content: flex-start;
    }
    .chord-line .cell {
      display: inline-block;
      padding: 1px 2px;
      vertical-align: middle;
      text-align: left;
      overflow: visible;
      flex: 0 0 calc(100% / var(--num-cells));
      min-width: calc(100% / var(--num-cells));
      max-width: calc(100% / var(--num-cells));
    }
    .chord-line .cell .chord-item {
      display: inline-block;
      padding: 1px 2px;
      font-weight: 700;
      white-space: nowrap;
      text-align: left;
      min-height: 18px;
      letter-spacing: 0.01em;
      max-width: 100%;
      overflow: visible;
      font-size: 0.85rem;
    }
    .chord-line .cell .chord-item.empty {
      display: none;
    }
    .chord-line .cell .chord-item.lyric {
      font-weight: 400;
      color: #3d2b1f;
    }
    .chord-line .bar .barline {
      display: none;
    }
    .chord-line .bar:not(.empty-bar)::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 2px;
      background-color: #c4ad92;
      z-index: 2;
      pointer-events: none;
    }
    .chord-line .bar:not(.empty-bar) .bar-inner {
      padding-right: 6px;
    }
    .chord-line .bar:last-child:not(.empty-bar)::after {
      display: none;
    }
    .chord-line:hover .bar:not(.empty-bar) {
      background-color: #f8f0e8;
    }
    .chord-line:hover .bar::after {
      background-color: #c4ad92 !important;
    }
    .chord-line:hover .bar .cell {
      background-color: transparent;
    }
    .lyrics-line {

    .lyrics-line .lyric-text {

      border: 1px solid #c4ad92;

  </style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="toolbar-left">
      <h1>🎸 Chord Chart Creator</h1>
      <button class="btn-toggle" id="toggleEditor">▲ Hide Editor</button>
      <div class="key-selector">
        <span>Key:</span>
        <select id="keySelect">
          <option value="C">C</option>
          <option value="G">G</option>
          <option value="D">D</option>
          <option value="A">A</option>
          <option value="E">E</option>
          <option value="B">B</option>
          <option value="F#">F#</option>
          <option value="Gb">Gb</option>
          <option value="Db">Db</option>
          <option value="Ab">Ab</option>
          <option value="Eb">Eb</option>
          <option value="Bb">Bb</option>
          <option value="F" selected>F</option>
        </select>
        <select class="key-mode-select" id="keyModeSelect">
          <option value="major">Major</option>
          <option value="minor" selected>Minor</option>
        </select>
        <span style="font-size:0.5rem; opacity:0.7;" id="keyDisplay">(Dm)</span>
      </div>
      <button class="btn-transpose" id="transposeDown" title="Transpose down a semitone">♭</button>
      <span class="transpose-info" id="transposeInfo">0</span>
      <button class="btn-transpose" id="transposeUp" title="Transpose up a semitone">♯</button>
      <div class="dropdown">
        <button class="btn btn-outline" id="dropdownToggle">📄 Songs ▼</button>
        <div class="dropdown-content" id="dropdownContent">
          <div class="dropdown-label" id="songsLabel">📂 LOAD/CLEAR SONGS</div>
          <div class="dropdown-item" id="selectFolder" style="color: #8b6b4a; font-weight: 600;">📁 Select Song Folder</div>
          <div class="dropdown-item" id="loadSingleFile" style="color: #8b6b4a; font-weight: 600;">📄 Open 1 Song File</div>
          <div class="dropdown-item" id="clearStoredSongs" style="color: #5c4033; font-weight: 500;">🗑️ Clear Song List Below</div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-label">🎵 SONG LIST</div>
          <div id="songsList"></div>
        </div>
      </div>
      <button class="btn btn-success" id="exportPNG">📷 Export PNG</button>
      <button class="btn btn-success" id="saveTXT">💾 Save TXT</button>
    </div>
  </div>
  <div class="editor-wrapper">
    <div class="preview-area" id="previewArea">
      <div id="previewContainer" class="chord-preview">
        <div class="content-wrapper" id="previewContent"></div>
      </div>
    </div>
    <div class="input-area" id="inputArea">
      <div class="resize-handle" id="resizeHandle"></div>
      <div class="drop-zone" id="dropZone">
        <div class="drop-message">📂 Drop .txt files here</div>
        <textarea id="chartInput" spellcheck="false"></textarea>
      </div>
    </div>
  </div>
</div>
<script>
  (function() {
    const inputEl = document.getElementById('chartInput');
    const previewContent = document.getElementById('previewContent');
    const previewContainer = document.getElementById('previewContainer');
    const inputArea = document.getElementById('inputArea');
    const previewArea = document.getElementById('previewArea');
    const toggleBtn = document.getElementById('toggleEditor');
    const resizeHandle = document.getElementById('resizeHandle');
    const dropdownToggle = document.getElementById('dropdownToggle');
    const dropdownContent = document.getElementById('dropdownContent');
    const songsList = document.getElementById('songsList');
    const dropZone = document.getElementById('dropZone');
    const transposeUpBtn = document.getElementById('transposeUp');
    const transposeDownBtn = document.getElementById('transposeDown');
    const transposeInfo = document.getElementById('transposeInfo');
    const keySelect = document.getElementById('keySelect');
    const keyModeSelect = document.getElementById('keyModeSelect');
    const keyDisplay = document.getElementById('keyDisplay');

    let currentSection = '';
    let activeButton = null;
    let isEditorCollapsed = false;
    let isResizing = false;
    let startY = 0;
    let startHeight = 0;
    let transposeSemitones = 0;
    let currentKey = 'Dm';
    let currentMode = 'minor';
    let originalText = '';

    // Chord transpose functions - with key limiting
    const NOTES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    const NOTE_MAP = {
      'C': 0, 'B#': 0,
      'C#': 1, 'Db': 1,
      'D': 2,
      'D#': 3, 'Eb': 3,
      'E': 4, 'Fb': 4,
      'F': 5, 'E#': 5,
      'F#': 6, 'Gb': 6,
      'G': 7,
      'G#': 8, 'Ab': 8,
      'A': 9,
      'A#': 10, 'Bb': 10,
      'B': 11, 'Cb': 11
    };

    // Valid keys (24-key list)
    const VALID_MAJOR_KEYS = ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'Gb', 'Db', 'Ab', 'Eb', 'Bb', 'F'];
    const VALID_MINOR_KEYS = ['Am', 'Em', 'Bm', 'F#m', 'C#m', 'G#m', 'D#m', 'Ebm', 'Bbm', 'Fm', 'Cm', 'Gm', 'Dm'];
    const VALID_ROOTS = [...VALID_MAJOR_KEYS, ...VALID_MINOR_KEYS];

    const MINOR_KEY_MAP = {
      'C': 'Am', 'G': 'Em', 'D': 'Bm', 'A': 'F#m', 'E': 'C#m', 'B': 'G#m',
      'F#': 'D#m', 'Gb': 'Ebm', 'Db': 'Bbm', 'Ab': 'Fm', 'Eb': 'Cm', 'Bb': 'Gm', 'F': 'Dm'
    };

    function updateKeyDisplay() {
      const majorRoot = keySelect.value;
      const minorRoot = MINOR_KEY_MAP[majorRoot] || 'Am';
      const displayKey = currentMode === 'minor' ? minorRoot : majorRoot;
      keyDisplay.textContent = `(${displayKey})`;
    }

    function getCurrentKey() {
      const majorRoot = keySelect.value;
      if (currentMode === 'minor') {
        return MINOR_KEY_MAP[majorRoot] || majorRoot;
      }
      return majorRoot;
    }

    // Key selector change handler
    keySelect.addEventListener('change', function() {
      currentKey = getCurrentKey();
      updateKeyDisplay();
      resetTransposition();
    });

    keyModeSelect.addEventListener('change', function() {
      currentMode = this.value;
      currentKey = getCurrentKey();
      updateKeyDisplay();
      resetTransposition();
    });

    // Key-based transposition - preserves interval relationships
    function transposeChordWithKey(chord, semitones, key) {
      if (!chord || chord === '_' || chord === '') return chord;
      if (semitones === 0) return chord;

      const match = chord.match(/^([A-G][#b]?)(.*)$/);
      if (!match) return chord;

      const root = match[1];
      const rest = match[2] || '';

      const keyIndex = NOTE_MAP[key];
      const rootIndex = NOTE_MAP[root];

      if (keyIndex === undefined || rootIndex === undefined) return chord;

      let interval = (rootIndex - keyIndex + 12) % 12;
      let newKeyIndex = (keyIndex + semitones + 12) % 12;

      const validKeys = VALID_ROOTS.filter(r => NOTE_MAP[r] === newKeyIndex);
      if (validKeys.length === 0) return chord;

      const keyHasSharp = key.includes('#');
      const keyHasFlat = key.includes('b');

      let newKey;
      if (keyHasSharp) {
        newKey = validKeys.find(r => r.includes('#'));
      } else if (keyHasFlat) {
        newKey = validKeys.find(r => r.includes('b'));
      } else {
        newKey = validKeys.find(r => !r.includes('#') && !r.includes('b'));
      }
      newKey = newKey || validKeys[0];

      const newKeyIndexActual = NOTE_MAP[newKey];
      let newRootIndex = (newKeyIndexActual + interval) % 12;

      const validRoots = VALID_ROOTS.filter(r => NOTE_MAP[r] === newRootIndex);
      if (validRoots.length === 0) return chord;

      const originalHasSharp = root.includes('#');
      const originalHasFlat = root.includes('b');

      let newRoot;
      if (originalHasSharp) {
        newRoot = validRoots.find(r => r.includes('#'));
      } else if (originalHasFlat) {
        newRoot = validRoots.find(r => r.includes('b'));
      } else {
        newRoot = validRoots.find(r => !r.includes('#') && !r.includes('b'));
      }
      newRoot = newRoot || validRoots[0];

      return newRoot + rest;
    }

    function transposeText(text, semitones, key) {
      if (semitones === 0) return text;

      const lines = text.split('\n');
      const transposedLines = lines.map(line => {
        const tokens = line.split(/(\s+)/);
        return tokens.map(token => {
          if (token.match(/^[A-G][#b]?[A-Za-z0-9#b/]*$/)) {
            if (token.includes('/')) {
              const parts = token.split('/');
              const transposedParts = parts.map(part => transposeChordWithKey(part, semitones, key));
              return transposedParts.join('/');
            }
            return transposeChordWithKey(token, semitones, key);
          }
          return token;
        }).join('');
      });

      return transposedLines.join('\n');
    }

    function applyTransposition() {
      const key = getCurrentKey();

      if (transposeSemitones === 0) {
        inputEl.value = originalText;
      } else {
        inputEl.value = transposeText(originalText, transposeSemitones, key);
      }
      updatePreview();
      transposeInfo.textContent = transposeSemitones;
    }

    function transposeUp() {
      if (transposeSemitones >= 6) {
        alert('Maximum transposition is +6 semitones (up a tritone)');
        return;
      }
      transposeSemitones++;
      applyTransposition();
    }

    function transposeDown() {
      if (transposeSemitones <= -6) {
        alert('Maximum transposition is -6 semitones (down a tritone)');
        return;
      }
      transposeSemitones--;
      applyTransposition();
    }

    function resetTransposition() {
      transposeSemitones = 0;
      transposeInfo.textContent = '0';
      if (originalText) {
        inputEl.value = originalText;
        updatePreview();
      }
    }

    function loadSong(content) {
      originalText = content;
      inputEl.value = content;
      resetTransposition();
    }

    // Drag and drop handlers
    function handleDragOver(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.add('drag-over');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('drag-over');
    }

    function handleDrop(e) {
      e.preventDefault();
      e.stopPropagation();
      dropZone.classList.remove('drag-over');

      const files = e.dataTransfer.files;
      if (files.length === 0) return;

      const txtFiles = Array.from(files).filter(file => file.name.endsWith('.txt'));

      if (txtFiles.length === 0) {
        alert('Please drop .txt files only.');
        return;
      }

      if (txtFiles.length === 1) {
        const file = txtFiles[0];
        const reader = new FileReader();
        reader.onload = function(event) {
          const content = event.target.result;
          const fileName = file.name.replace('.txt', '');
          const folder = file.webkitRelativePath ? getFolderPath(file.webkitRelativePath) : '';

          const storedSongs = loadStoredSongs() || [];
          const existingIndex = storedSongs.findIndex(s => s.name === fileName && s.folder === folder);
          if (existingIndex >= 0) {
            storedSongs[existingIndex].content = content;
          } else {
            storedSongs.push({ name: fileName, content: content, folder: folder });
          }
          saveSongsToStorage(storedSongs);

          loadSong(content);
          displayStoredSongs();

          const btn = dropdownToggle;
          const origText = btn.textContent;
          btn.textContent = `📄 ${fileName}`;
          setTimeout(() => {
            btn.textContent = origText;
          }, 3000);
        };
        reader.readAsText(file);
        return;
      }

      const storedSongs = loadStoredSongs() || [];
      let loadedCount = 0;

      txtFiles.forEach((file, index) => {
        const reader = new FileReader();
        reader.onload = function(event) {
          const content = event.target.result;
          const fileName = file.name.replace('.txt', '');
          const folder = file.webkitRelativePath ? getFolderPath(file.webkitRelativePath) : '';

          const existingIndex = storedSongs.findIndex(s => s.name === fileName && s.folder === folder);
          if (existingIndex >= 0) {
            storedSongs[existingIndex].content = content;
          } else {
            storedSongs.push({ name: fileName, content: content, folder: folder });
          }

          loadedCount++;
          if (loadedCount === txtFiles.length) {
            saveSongsToStorage(storedSongs);
            displayStoredSongs();

            const firstFile = txtFiles[0];
            const firstReader = new FileReader();
            firstReader.onload = function(e) {
              loadSong(e.target.result);
            };
            firstReader.readAsText(firstFile);

            const btn = dropdownToggle;
            const origText = btn.textContent;
            btn.textContent = `📄 ${txtFiles.length} songs loaded`;
            setTimeout(() => {
              btn.textContent = origText;
            }, 3000);
          }
        };
        reader.readAsText(file);
      });
    }

    document.addEventListener('dragover', function(e) {
      e.preventDefault();
    });
    document.addEventListener('drop', function(e) {
      e.preventDefault();
    });

    dropZone.addEventListener('dragover', handleDragOver);
    dropZone.addEventListener('dragleave', handleDragLeave);
    dropZone.addEventListener('drop', handleDrop);

    // Load saved songs from localStorage
    function loadStoredSongs() {
      try {
        const stored = localStorage.getItem('chordChartSongs');
        if (stored) {
          const songs = JSON.parse(stored);
          return songs;
        }
      } catch (e) {
        console.log('Could not load stored songs');
      }
      return null;
    }

    // Save songs to localStorage
    function saveSongsToStorage(songs) {
      try {
        localStorage.setItem('chordChartSongs', JSON.stringify(songs));
      } catch (e) {
        console.log('Could not save songs to storage');
      }
    }

    // Clear stored songs
    function clearStoredSongs() {
      if (confirm('Clear all saved songs from memory? (This will not delete your files)')) {
        localStorage.removeItem('chordChartSongs');
        displayStoredSongs();
      }
    }

    // Remove a single song
    function removeSong(songName, songFolder) {
      const storedSongs = loadStoredSongs() || [];
      const index = storedSongs.findIndex(s => s.name === songName && s.folder === (songFolder || ''));
      if (index >= 0) {
        if (confirm(`Are you sure you want to remove "${songName}"?`)) {
          storedSongs.splice(index, 1);
          saveSongsToStorage(storedSongs);
          displayStoredSongs();
        }
      }
    }

    function getFolderPath(filePath) {
      const parts = filePath.split(/[\/\\]/);
      parts.pop();
      return parts.join('/');
    }

    // Display stored songs with nested folder structure and remove buttons
    function displayStoredSongs() {
      const storedSongs = loadStoredSongs();
      songsList.innerHTML = '';

      if (storedSongs && storedSongs.length > 0) {
        const tree = {};

        storedSongs.forEach(song => {
          const folder = song.folder || '';
          if (folder === '') {
            if (!tree._root) {
              tree._root = [];
            }
            tree._root.push(song);
          } else {
            const parts = folder.split('/').filter(p => p !== '');
            let current = tree;
            for (let part of parts) {
              if (!current[part]) {
                current[part] = {};
              }
              current = current[part];
            }
            if (!current._songs) {
              current._songs = [];
            }
            current._songs.push(song);
          }
        });

        const folderNames = Object.keys(tree).filter(k => k !== '_root');
        folderNames.sort((a, b) => a.localeCompare(b, 'th', { sensitivity: 'base' }));

        folderNames.forEach(folderName => {
          const folderItem = document.createElement('div');
          folderItem.className = 'dropdown-item folder-item';
          folderItem.textContent = folderName;

          const arrow = document.createElement('span');
          arrow.className = 'folder-arrow';
          arrow.textContent = '▶';
          folderItem.appendChild(arrow);

          const popup = document.createElement('div');
          popup.className = 'subfolder-popup';

          const subTree = tree[folderName];
          if (subTree._songs) {
            subTree._songs.sort((a, b) => a.name.localeCompare(b.name, 'th', { sensitivity: 'base' }));
            subTree._songs.forEach(song => {
              const songItem = createSongItem(song);
              popup.appendChild(songItem);
            });
          }

          const subFolderNames = Object.keys(subTree).filter(k => k !== '_songs');
          subFolderNames.sort((a, b) => a.localeCompare(b, 'th', { sensitivity: 'base' }));

          subFolderNames.forEach(subFolderName => {
            const subFolderTree = subTree[subFolderName];
            const subFolderItem = document.createElement('div');
            subFolderItem.className = 'dropdown-item folder-item';
            subFolderItem.textContent = subFolderName;

            const subArrow = document.createElement('span');
            subArrow.className = 'folder-arrow';
            subArrow.textContent = '▶';
            subFolderItem.appendChild(subArrow);

            const subPopup = document.createElement('div');
            subPopup.className = 'subfolder-popup';

            if (subFolderTree._songs) {
              subFolderTree._songs.sort((a, b) => a.name.localeCompare(b.name, 'th', { sensitivity: 'base' }));
              subFolderTree._songs.forEach(song => {
                const songItem = createSongItem(song);
                subPopup.appendChild(songItem);
              });
            }

            subFolderItem.appendChild(subPopup);

            subFolderItem.addEventListener('mouseenter', function(e) {
              document.querySelectorAll('.subfolder-popup.show').forEach(p => {
                if (p !== subPopup) p.classList.remove('show');
              });
              subPopup.style.top = '0px';
              subPopup.style.left = '100%';
              subPopup.classList.add('show');
            });

            subFolderItem.addEventListener('mouseleave', function(e) {
              setTimeout(() => {
                if (!subPopup.matches(':hover') && !subFolderItem.matches(':hover')) {
                  subPopup.classList.remove('show');
                }
              }, 300);
            });

            subPopup.addEventListener('mouseenter', function(e) {
              subPopup.classList.add('show');
            });

            subPopup.addEventListener('mouseleave', function(e) {
              setTimeout(() => {
                if (!subFolderItem.matches(':hover')) {
                  subPopup.classList.remove('show');
                }
              }, 300);
            });

            popup.appendChild(subFolderItem);
          });

          folderItem.appendChild(popup);

          folderItem.addEventListener('mouseenter', function(e) {
            document.querySelectorAll('.subfolder-popup.show').forEach(p => {
              if (p !== popup) p.classList.remove('show');
            });
            popup.style.top = '0px';
            popup.style.left = '100%';
            popup.classList.add('show');
          });

          folderItem.addEventListener('mouseleave', function(e) {
            setTimeout(() => {
              if (!popup.matches(':hover') && !folderItem.matches(':hover')) {
                popup.classList.remove('show');
              }
            }, 300);
          });

          popup.addEventListener('mouseenter', function(e) {
            popup.classList.add('show');
          });

          popup.addEventListener('mouseleave', function(e) {
            setTimeout(() => {
              if (!folderItem.matches(':hover')) {
                popup.classList.remove('show');
              }
            }, 300);
          });

          songsList.appendChild(folderItem);
        });

        if (tree._root) {
          tree._root.sort((a, b) => a.name.localeCompare(b.name, 'th', { sensitivity: 'base' }));
          tree._root.forEach(song => {
            const songItem = createSongItem(song);
            songsList.appendChild(songItem);
          });
        }

        if (folderNames.length === 0 && (!tree._root || tree._root.length === 0)) {
          const emptyMsg = document.createElement('div');
          emptyMsg.className = 'dropdown-item';
          emptyMsg.style.cssText = 'color: #b0987a; font-size: 0.55rem; padding: 4px 14px; font-style: italic;';
          emptyMsg.textContent = 'No songs loaded';
          songsList.appendChild(emptyMsg);
        }
      } else {
        const emptyMsg = document.createElement('div');
        emptyMsg.className = 'dropdown-item';
        emptyMsg.style.cssText = 'color: #b0987a; font-size: 0.55rem; padding: 4px 14px; font-style: italic;';
        emptyMsg.textContent = 'No songs loaded';
        songsList.appendChild(emptyMsg);
      }
    }

    // Create a song item with remove button
    function createSongItem(song) {
      const songItem = document.createElement('div');
      songItem.className = 'dropdown-item song-item';

      const nameSpan = document.createElement('span');
      nameSpan.className = 'song-name';
      nameSpan.textContent = song.name;

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '✕';
      removeBtn.title = 'Remove this song';
      removeBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        removeSong(song.name, song.folder || '');
      });

      nameSpan.addEventListener('click', function(e) {
        e.stopPropagation();
        loadSong(song.content);
        dropdownContent.classList.remove('show');
        document.querySelectorAll('.dropdown-item.song-item, .subfolder-popup .dropdown-item.song-item').forEach(el => {
          el.classList.remove('active');
        });
        songItem.classList.add('active');
      });

      songItem.appendChild(nameSpan);
      songItem.appendChild(removeBtn);
      return songItem;
    }

    // Dropdown toggle
    dropdownToggle.addEventListener('click', function(e) {
      e.stopPropagation();
      dropdownContent.classList.toggle('show');
      document.querySelectorAll('.subfolder-popup.show').forEach(p => p.classList.remove('show'));
      displayStoredSongs();
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
      if (!dropdownToggle.contains(e.target) && !dropdownContent.contains(e.target)) {
        dropdownContent.classList.remove('show');
        document.querySelectorAll('.subfolder-popup.show').forEach(p => p.classList.remove('show'));
      }
    });

    // Clear stored songs button
    document.getElementById('clearStoredSongs').addEventListener('click', function(e) {
      e.stopPropagation();
      clearStoredSongs();
      dropdownContent.classList.remove('show');
    });

    // Load single file
    document.getElementById('loadSingleFile').addEventListener('click', function(e) {
      e.stopPropagation();
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = '.txt';

      fileInput.onchange = function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
          const content = event.target.result;
          const fileName = file.name.replace('.txt', '');
          const folder = file.webkitRelativePath ? getFolderPath(file.webkitRelativePath) : '';

          const storedSongs = loadStoredSongs() || [];
          const existingIndex = storedSongs.findIndex(s => s.name === fileName && s.folder === folder);
          if (existingIndex >= 0) {
            storedSongs[existingIndex].content = content;
          } else {
            storedSongs.push({ name: fileName, content: content, folder: folder });
          }
          saveSongsToStorage(storedSongs);

    // Select Folder
    document.getElementById('selectFolder').addEventListener('click', function(e) {
      e.stopPropagation();
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = '.txt';
      fileInput.webkitdirectory = true;
      fileInput.multiple = true;

      fileInput.onchange = function(e) {
        const files = e.target.files;
        const songFiles = [];
        const storedSongs = loadStoredSongs() || [];

        for (let file of files) {
          if (file.name.endsWith('.txt')) {
            const fileName = file.name.replace('.txt', '');
            const fullPath = file.webkitRelativePath || file.name;
            const parts = fullPath.split(/[\/\\]/);
            parts.pop();
            const folder = parts.join('/');
            songFiles.push({
              name: fileName,
              file: file,
              fullPath: fullPath,
              folder: folder
            });
          }
        }

        if (songFiles.length === 0) {
          alert('No .txt files found in the selected folder.\n\nPlease select a folder that contains .txt chord chart files.');
          return;
        }

        songFiles.sort((a, b) => {
          return a.name.localeCompare(b.name, 'th', { sensitivity: 'base' });
        });

        let loadedCount = 0;
        songFiles.forEach((song, index) => {
          const reader = new FileReader();
          reader.onload = function(event) {
            const content = event.target.result;
            const existingIndex = storedSongs.findIndex(s => s.name === song.name && s.folder === song.folder);
            if (existingIndex >= 0) {
              storedSongs[existingIndex].content = content;
            } else {
              storedSongs.push({ name: song.name, content: content, folder: song.folder });
            }
            loadedCount++;
            if (loadedCount === songFiles.length) {
              saveSongsToStorage(storedSongs);
              displayStoredSongs();
              resetTransposition();
              const firstContent = songFiles[0] ? songFiles[0].file : null;
              if (firstContent) {
                const firstReader = new FileReader();
                firstReader.onload = function(e) {
                  originalText = e.target.result;
                  inputEl.value = e.target.result;
                  resetTransposition();
                };
                firstReader.readAsText(firstContent);
              }
              const btn = dropdownToggle;
              const origText = btn.textContent;
              btn.textContent = `📄 ${songFiles.length} songs loaded`;
              setTimeout(() => {
                btn.textContent = origText;
              }, 3000);
            }
          };
          reader.readAsText(song.file);
        });
      };

      fileInput.click();
    });

    // Chord chart functions

        '75': 'Bridge 5',

      };

      const singleNumberMap = {
        '1': 'Intro',
        '2': 'Verse',
        '3': 'Pre-Chorus',
        '4': 'Chorus',
        '5': 'Post-Chorus',
        '6': 'Instrumental',
        '7': 'Bridge',
        '8': 'Outro'
      };

      const textShortcuts = {
        'int': 'Intro',
        'i': 'Intro',
        'v': 'Verse',
        'ver': 'Verse',
        'pr': 'Pre-Chorus',
        'pre': 'Pre-Chorus',
        'ch': 'Chorus',
        'cho': 'Chorus',
        'po': 'Post-Chorus',
        'post': 'Post-Chorus',
        'b': 'Bridge',
        'bri': 'Bridge',
        'ins': 'Instrumental',
        'inst': 'Instrumental',
        'out': 'Outro',
        'o': 'Outro',
        'tag': 'Tag',
        't': 'Tag',
        'end': 'Ending',
        'ending': 'Ending'
      };

      if (lower.match(/^[2-7][1-9]$/)) {
        return numberMap[lower] || name;
      }
      if (lower.match(/^[1-8]$/)) {
        return singleNumberMap[lower] || name;
      }
      const match = lower.match(/^(int|i|v|ver|pr|pre|ch|cho|po|post|b|bri|ins|inst|out|o|tag|t|end|ending)(?:\s*(\d+))?$/);
      if (match) {
        const shortcut = match[1];
        const number = match[2] || '';
        let fullName = textShortcuts[shortcut] || shortcut;
        fullName = fullName.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        return number ? `${fullName} ${number}` : fullName;
      }
      const fullMatch = lower.match(/^(intro|verse|pre-chorus|chorus|post-chorus|bridge|instrumental|outro|tag|ending)(?:\s*(\d+))?$/);
      if (fullMatch) {
        const fullName = fullMatch[1];
        const number = fullMatch[2] || '';
        const capitalized = fullName.split(' ').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        const finalName = capitalized.replace(/Pre-Chorus/, 'Pre-Chorus').replace(/Post-Chorus/, 'Post-Chorus');
        return number ? `${finalName} ${number}` : finalName;
      }
      return name;
    }

    function capitalizeSectionName(name) {
      let expanded = expandSectionShortcut(name);
      return expanded.split(' ').map(word => {
        if (word.toLowerCase() === 'pre-chorus') return 'Pre-Chorus';
        if (word.toLowerCase() === 'post-chorus') return 'Post-Chorus';
        return word.charAt(0).toUpperCase() + word.slice(1);
      }).join(' ');
    }

    function getSectionClass(sectionName) {
      const name = sectionName.toLowerCase().trim();
      if (name.includes('intro')) return 'section-intro';
      if (name.includes('verse')) return 'section-verse';
      if (name.includes('pre-chorus')) return 'section-pre-chorus';
      if (name.includes('post-chorus')) return 'section-post-chorus';
      if (name.includes('chorus')) return 'section-chorus';
      if (name.includes('bridge')) return 'section-bridge';
      if (name.includes('instrumental')) return 'section-instrumental';
      if (name.includes('outro')) return 'section-outro';
      return '';
    }

    function normalizeChord(chord) {
      if (!chord || chord === '_' || chord === '') return chord;
      const match = chord.match(/^([a-gA-G])([#b]?)(.*)$/);
      if (match) {
        const root = match[1].toUpperCase();
        const accidental = match[2];
        const rest = match[3];
        return root + accidental + rest;
      }
      return chord;
    }

    function simplifyChord(chord) {
      if (!chord || chord === '_' || chord === '') return chord;
      let simplified = normalizeChord(chord);
      if (simplified.match(/[A-G][#b]?d\b/i) || simplified.match(/[A-G][#b]?dim\b/i) || simplified.includes('°')) {
        simplified = simplified.replace(/d|dim|°/gi, '°');
        return simplified.trim();
      }
      if (simplified.match(/[A-G][#b]?h\b/i) || simplified.toLowerCase().includes('halfdim') || simplified.toLowerCase().includes('half-dim') || simplified.toLowerCase().includes('half diminished') || simplified.includes('ø')) {
        return simplified.replace(/h|halfdim|half-dim|half diminished|half-diminished|ø/gi, 'ø').trim();
      }
      if (simplified.match(/[A-G][#b]?M7?\b/)) {
        simplified = simplified.replace(/M7?/g, 'Δ');
        return simplified.trim();
      }
      if (simplified.match(/[A-G][#b]?Maj7\b/i) || simplified.match(/[A-G][#b]?maj7\b/i) || simplified.includes('Δ')) {
        simplified = simplified.replace(/Maj7|maj7|Δ7|Δ/gi, 'Δ');
        return simplified.trim();
      }
      return simplified;
    }

    function splitIntoBars(line) {
      let protected = line;
      const slashChordRegex = /([A-Za-z0-9#b]+)\/([A-Za-z0-9#b]+)/g;
      let matches = [];
      let match;
      while ((match = slashChordRegex.exec(protected)) !== null) {
        matches.push({ start: match.index, end: match.index + match[0].length, full: match[0] });
      }
      let placeholders = [];
      let result = protected;
      for (let i = matches.length - 1; i >= 0; i--) {
        const placeholder = `__SLASH_${i}__`;
        placeholders.push({ original: matches[i].full, placeholder: placeholder });
        result = result.substring(0, matches[i].start) + placeholder + result.substring(matches[i].end);
      }
      let bars = result.split(/[|/\\]/).map(b => b.trim()).filter(b => b !== '');
      bars = bars.map(bar => {
        let restored = bar;
        for (let p of placeholders) {
          restored = restored.replace(p.placeholder, p.original);
        }
        return restored;
      });
      return bars;
    }

    function getGlobalMaxBars(text) {
      const lines = text.split('\n');
      let maxBars = 0;
      for (let line of lines) {
        if (line.includes('|') || line.includes('/') || line.includes('\\')) {
          const bars = splitIntoBars(line);
          maxBars = Math.max(maxBars, bars.length);
        }
      }
      return maxBars;
    }

    function getGlobalMaxChords(text) {
      const lines = text.split('\n');
      let maxChords = 0;
      for (let line of lines) {
        if (line.includes('|') || line.includes('/') || line.includes('\\')) {
          const bars = splitIntoBars(line);
          bars.forEach(bar => {
            const tokens = bar.split(/\s+/).filter(t => t !== '' && t !== '_');
            if (tokens.length > maxChords) maxChords = tokens.length;
          });
        }
      }
      return Math.max(maxChords, 1);
    }

    function parseBarToCellsDynamic(barContent, numCells) {
      let tokens = barContent.split(/\s+/).filter(t => t !== '' && t !== '_');
      tokens = tokens.map(token => simplifyChord(token));

      let cells = new Array(numCells).fill('_');

      if (tokens.length === 0) return cells;

      if (tokens.length === 1) {
        cells[0] = tokens[0];
        return cells;
      }

      if (tokens.length === 2) {
        if (numCells === 2) {
          cells[0] = tokens[0];
          cells[1] = tokens[1];
        } else if (numCells === 3) {
          cells[0] = tokens[0];
          cells[2] = tokens[1];
        } else {
          cells[0] = tokens[0];
          cells[2] = tokens[1];
        }
        return cells;
      }

      if (tokens.length === 3) {
        if (numCells === 3) {
          cells[0] = tokens[0];
          cells[1] = tokens[1];
          cells[2] = tokens[2];
        } else {
          cells[0] = tokens[0];
          cells[1] = tokens[1];
          cells[2] = tokens[2];
        }
        return cells;
      }

      for (let i = 0; i < Math.min(numCells, tokens.length); i++) {
        cells[i] = tokens[i];
      }
      return cells;
    }

    function isBarEmpty(barContent) {
      let tokens = barContent.split(/\s+/).filter(t => t !== '' && t !== '_');
      return tokens.length === 0;
    }

    function adjustChordSizes() {
      const content = previewContent;
      if (!content) return;

      const chordLines = content.querySelectorAll('.chord-line');
      if (chordLines.length === 0) return;

      const firstCell = content.querySelector('.cell');
      if (!firstCell) return;

      const firstLine = content.querySelector('.chord-line');
      const numCells = firstLine ? parseInt(firstLine.style.getPropertyValue('--num-cells')) || 4 : 4;

      const cellWidth = (firstCell.parentElement.offsetWidth / numCells) - 8;
      if (cellWidth < 10) return;

      let globalMaxText = '';
      chordLines.forEach(row => {
        const cells = row.querySelectorAll('.cell .chord-item:not(.empty)');
        cells.forEach(cell => {
          const text = cell.textContent || '';
          if (text.length > globalMaxText.length) {
            globalMaxText = text;
          }
        });
      });

      if (!globalMaxText) return;

      const testSpan = document.createElement('span');
      testSpan.style.cssText = `position:absolute; visibility:hidden; white-space:nowrap; font-family: "SF Mono", "Fira Code", monospace; font-weight: 700;`;
      testSpan.textContent = globalMaxText;
      document.body.appendChild(testSpan);

      const maxSize = isEditorCollapsed ? 2.5 : 1.8;
      let low = 0.1;
      let high = maxSize * 2;
      let bestSize = maxSize * 0.4;
      let iterations = 30;

      for (let i = 0; i < iterations; i++) {
        const mid = (low + high) / 2;
        testSpan.style.fontSize = mid + 'rem';
        const width = testSpan.offsetWidth;
        if (width <= cellWidth * 0.90) {
          bestSize = mid;
          low = mid;
        } else {
          high = mid;
        }
      }

      document.body.removeChild(testSpan);

      chordLines.forEach(row => {
        const cells = row.querySelectorAll('.cell .chord-item:not(.empty)');
        cells.forEach(cell => {
          cell.style.fontSize = Math.round(bestSize * 100) / 100 + 'rem';
        });
      });
    }

    function renderPreview(text) {
      if (!text || text.trim() === '') {
        previewContent.innerHTML = `
          <div class="empty-preview">
            <div class="main-text">Type or Paste your chord chart (in the editor area below)</div>
            <div class="sub-text">or Drag &amp; Drop a TXT file with a chord chart (into the editor area below)</div>
          </div>
        `;
        return;
      }
      let html = '';
      const lines = text.split('\n');
      currentSection = '';
      const globalMaxBars = getGlobalMaxBars(text);
      const globalMaxChords = getGlobalMaxChords(text);

      for (let line of lines) {
        const trimmed = line.trim();
        if (trimmed === '---' || trimmed === '___' || trimmed === '***') {
          html += `<div class="hr-line"><span class="hr"></span></div>`;
          continue;
        }
        if (trimmed === '') {
          html += `<div class="empty-line"></div>`;
          continue;
        }
        const customLabelMatch = trimmed.match(/^\[(.*?)\]$/);
        if (customLabelMatch) {
          const labelText = customLabelMatch[1].trim();
          html += `<div class="section-block section-custom"><span class="section">${labelText}</span></div>`;
          currentSection = 'custom';
          continue;
        }

        const sectionNameMatch = trimmed.match(/^(Intro|Verse|Pre-Chorus|Chorus|Post-Chorus|Bridge|Outro|Instrumental|Tag|Ending|Coda)/i);

        if (sectionNameMatch) {
          const sectionName = sectionNameMatch[1].trim();
          const rest = trimmed.substring(sectionName.length).trim();

          let isLabel = false;

          if (!rest) {
            isLabel = true;
          } else if (rest.length < 40 && !rest.endsWith('.') && !rest.endsWith('!') && !rest.endsWith('?')) {
            isLabel = true;
          } else if (rest.match(/^[\(\[].*[\)\]]$/)) {
            isLabel = true;
          } else if (rest.match(/^[0-9]/)) {
            isLabel = true;
          }

          if (isLabel) {
            let displayName = sectionName.charAt(0).toUpperCase() + sectionName.slice(1);

            currentSection = displayName;
            const sectionClass = getSectionClass(displayName);

            if (!rest) {
              html += `<div class="section-block ${sectionClass}"><span class="section"><span class="section-name">${displayName}</span></span></div>`;
            } else {
              const numberMatch = rest.match(/^(\d+)\s*(.*)$/);
              let boldPart = displayName;
              let thinPart = rest;

              if (numberMatch) {
                const number = numberMatch[1];
                const restAfterNumber = numberMatch[2] ? numberMatch[2].trim() : '';
                boldPart = displayName + ' ' + number;
                thinPart = restAfterNumber;
              }

              let fullLabel = `<span class="section-name">${boldPart}</span>`;
              if (thinPart) {
                fullLabel += ` <span class="section-extra">${thinPart}</span>`;
              }
              html += `<div class="section-block ${sectionClass}"><span class="section">${fullLabel}</span></div>`;
            }
            continue;
          }
        }

        const numberShortcutMatch = trimmed.match(/^\s*([2-7][1-9]|[1-8])\s*(.*)$/i);
        if (numberShortcutMatch) {
          const shortcut = numberShortcutMatch[1].trim();
          let extraText = numberShortcutMatch[2] ? numberShortcutMatch[2].trim() : '';

          const expandedName = expandSectionShortcut(shortcut);

          currentSection = expandedName;
          const sectionClass = getSectionClass(expandedName);

          const numberMatch = extraText.match(/^(\d+)\s*(.*)$/);
          let boldPart = expandedName;
          let thinPart = extraText;

          if (numberMatch) {
            const number = numberMatch[1];
            const restAfterNumber = numberMatch[2] ? numberMatch[2].trim() : '';
            boldPart = expandedName + ' ' + number;
            thinPart = restAfterNumber;
          }

          let fullLabel = `<span class="section-name">${boldPart}</span>`;
          if (thinPart) {
            fullLabel += ` <span class="section-extra">${thinPart}</span>`;
          }

          html += `<div class="section-block ${sectionClass}"><span class="section">${fullLabel}</span></div>`;
          continue;
        }

        if (line.includes('|') || line.includes('/') || line.includes('\\')) {
          let bars = splitIntoBars(line);
          if (bars.length > 0) {
            let chordLineHtml = `<div class="chord-line" style="--num-cells: ${globalMaxChords};">`;
            while (bars.length < globalMaxBars) { bars.push('_ _ _ _'); }
            bars.forEach((bar, barIndex) => {
              const cells = parseBarToCellsDynamic(bar, globalMaxChords);
              let sectionClass = getSectionClass(currentSection);
              if (currentSection === 'custom' || currentSection.toLowerCase().includes('custom')) {
                sectionClass = 'section-custom';
              }
              const isEmpty = isBarEmpty(bar);
              const isEmptyBar = bar === '_ _ _ _' || bar === '';
              const emptyClass = isEmpty || isEmptyBar ? ' empty-bar' : '';
              chordLineHtml += `<div class="bar${emptyClass}">`;
              chordLineHtml += `<div class="bar-inner">`;
              cells.forEach((cellContent) => {
                const isUnderscore = cellContent === '_' || cellContent === '';
                const displayText = isUnderscore ? '_' : cellContent;
                let classes = 'chord-item';
                if (isUnderscore) { classes += ' empty'; }
                if (sectionClass) classes += ` ${sectionClass}`;
                chordLineHtml += `<span class="cell">`;
                chordLineHtml += `<span class="${classes}">${displayText}</span>`;
                chordLineHtml += `</span>`;
              });
              chordLineHtml += `</div>`;
              chordLineHtml += `</div>`;
            });
            chordLineHtml += '</div>';
            html += chordLineHtml;
          }
        } else if (trimmed !== '') {
          const isLyrics = !trimmed.match(/[A-G]/i) || trimmed.length > 10;
          if (isLyrics) {
            html += `<div class="lyrics-line"><span class="lyric-text">${trimmed}</span></div>`;
          } else {
            html += `<div style="color: #b0987a; font-size: 0.65rem; padding: 1px 0; opacity: 0.8;">${trimmed}</div>`;
          }
        }
      }
      previewContent.innerHTML = html;
      requestAnimationFrame(() => {
        setTimeout(() => { adjustChordSizes(); }, 50);
      });
    }

    function updatePreview() {
      renderPreview(inputEl.value);
    }

    // Save as TXT functionality
    document.getElementById('saveTXT').addEventListener('click', function() {
        const content = inputEl.value;
        if (!content || content.trim() === '') {
            alert('Nothing to save. The editor is empty.');
            return;
        }

        // Get song name if available - PRESERVE Thai and Unicode characters
        const songName = document.querySelector('.dropdown-item.active .song-name')?.textContent || 'chord-chart';
        // Only remove characters that are illegal in filenames
        const sanitizedName = songName.replace(/[<>:"/\\|?*\x00-\x1f]/g, '').trim() || 'chord-chart';
        const timestamp = new Date().toISOString().slice(0,10);
        const fileName = `${sanitizedName}_${timestamp}.txt`;

        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = fileName;
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);

        this.textContent = '✅ Saved!';
        setTimeout(() => {
            this.textContent = '💾 Save TXT';
        }, 2000);
    });

    // PNG Export functionality
    document.getElementById('exportPNG').addEventListener('click', async function() {
        const preview = document.getElementById('previewContainer');
        const contentWrapper = document.getElementById('previewContent');
        const songName = document.querySelector('.dropdown-item.active .song-name')?.textContent || 'chord-chart';

        this.textContent = '⏳ Exporting...';
        this.disabled = true;

        try {
            const originalHeight = preview.style.height;
            const originalMaxHeight = preview.style.maxHeight;
            const originalOverflow = preview.style.overflow;
            const originalPadding = preview.style.padding;
            const originalBorder = preview.style.border;
            const originalBorderRadius = preview.style.borderRadius;
            const originalBoxShadow = preview.style.boxShadow;
            const originalBackground = preview.style.background;

            preview.style.height = 'auto';
            preview.style.maxHeight = 'none';
            preview.style.overflow = 'visible';
            preview.style.padding = '40px';
            preview.style.border = 'none';
            preview.style.borderRadius = '0';
            preview.style.boxShadow = 'none';
            preview.style.background = '#ffffff';

            preview.offsetHeight;

            const fullWidth = contentWrapper.scrollWidth || preview.scrollWidth;
            const fullHeight = contentWrapper.scrollHeight || preview.scrollHeight;

            const padding = 40;
            const totalWidth = fullWidth + (padding * 2);
            const totalHeight = fullHeight + (padding * 2);

            preview.style.width = totalWidth + 'px';
            preview.style.height = totalHeight + 'px';

            const canvas = await html2canvas(preview, {
                scale: 3,
                backgroundColor: '#ffffff',
                useCORS: true,
                logging: false,
                width: totalWidth,
                height: totalHeight,
                allowTaint: false,
                foreignObjectRendering: false,
                onclone: function(doc) {
                    const container = doc.getElementById('previewContainer');
                    if (container) {
                        container.style.padding = '40px';
                        container.style.background = '#ffffff';
                        container.style.border = 'none';
                        container.style.borderRadius = '0';
                        container.style.boxShadow = 'none';
                        container.style.height = 'auto';
                        container.style.maxHeight = 'none';
                        container.style.overflow = 'visible';
                        container.style.width = totalWidth + 'px';
                    }
                }
            });

            preview.style.height = originalHeight || '';
            preview.style.maxHeight = originalMaxHeight || '';
            preview.style.overflow = originalOverflow || '';
            preview.style.padding = originalPadding || '';
            preview.style.border = originalBorder || '';
            preview.style.borderRadius = originalBorderRadius || '';
            preview.style.boxShadow = originalBoxShadow || '';
            preview.style.background = originalBackground || '';
            preview.style.width = '';

            const link = document.createElement('a');
            // PRESERVE Thai and Unicode characters in filename
            const sanitizedName = songName.replace(/[<>:"/\\|?*\x00-\x1f]/g, '').trim() || 'chord-chart';
            const timestamp = new Date().toISOString().slice(0,19).replace(/[:-]/g, '');
            const fileName = `${sanitizedName}_${timestamp}.png`;
            link.download = fileName;
            link.href = canvas.toDataURL('image/png');
            link.click();

            this.textContent = '✅ Exported!';
            setTimeout(() => {
                this.textContent = '📷 Export PNG';
                this.disabled = false;
            }, 2000);

        } catch (err) {
            console.error('Export failed:', err);
            preview.style.height = '';
            preview.style.maxHeight = '';
            preview.style.overflow = '';
            preview.style.padding = '';
            preview.style.border = '';
            preview.style.borderRadius = '';
            preview.style.boxShadow = '';
            preview.style.background = '';
            preview.style.width = '';
            this.textContent = '❌ Export failed';
            setTimeout(() => {
                this.textContent = '📷 Export PNG';
                this.disabled = false;
            }, 2000);
        }
    });

    // Transpose event listeners
    transposeUpBtn.addEventListener('click', transposeUp);
    transposeDownBtn.addEventListener('click', transposeDown);

    // Keyboard shortcuts for transpose
    document.addEventListener('keydown', function(e) {
      if (e.ctrlKey && e.shiftKey && (e.key === 'ArrowUp' || e.key === '=' || e.key === '+')) {
        e.preventDefault();
        transposeUp();
      }
      if (e.ctrlKey && e.shiftKey && (e.key === 'ArrowDown' || e.key === '-')) {
        e.preventDefault();
        transposeDown();
      }
    });

    // Initialize: load stored songs on page load
    displayStoredSongs();

    // Set initial key
    originalText = inputEl.value;
    currentKey = getCurrentKey();
    updateKeyDisplay();
    resetTransposition();

    inputEl.addEventListener('input', function() {
      // When user manually edits, update originalText
      originalText = inputEl.value;
      transposeSemitones = 0;
      transposeInfo.textContent = '0';
      updatePreview();
    });

    updatePreview();
    window.addEventListener('load', function() {
      setTimeout(adjustChordSizes, 100);
    });

    let resizeTimeout;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(adjustChordSizes, 100);
    });
  })();
</script>
</body>
</html>
